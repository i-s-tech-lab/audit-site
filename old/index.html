літика по замовленнях › Усі відділи\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Термінал замовлення": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3.5h12v17l-3-2-3 2-3-2-3 2z\"/><path d=\"M9 8h6M9 11.5h6M9 15h3.5\"/><\/svg><\/span><h4 class=\"ui-help__title\">Термінал замовлення<\/h4><\/header>\n  <p class=\"ui-help__text\">Усе про одне замовлення на одному екрані: скільки перевірили й забракували в кожному відділі, що саме бракує, як це змінювалось від першого аудиту, і самі аудити.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3.5h12v17l-3-2-3 2-3-2-3 2z\"/><path d=\"M9 8h6M9 11.5h6M9 15h3.5\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Вкладка «Усі»<\/span><span class=\"ui-help__pt-text\">Сума всіх відділів плану. «Від плану» = перевірено разом ÷ (план × кількість відділів у плані): 1 012 ÷ (800 × 5) = 25%.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-status ui-status--ok ui-status--sm\" role=\"img\" aria-label=\"Брак у нормі\" title=\"Брак у нормі\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Галочка на вкладці відділу<\/span><span class=\"ui-help__pt-text\">Замовлення у відділі перевіряли, брак не вищий за критичний рівень.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-status ui-status--over ui-status--sm\" role=\"img\" aria-label=\"Понад критичний рівень\" title=\"Понад критичний рівень\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Червоне коло з «!»<\/span><span class=\"ui-help__pt-text\">Брак замовлення у відділі строго більший за критичний рівень (5%).<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-status ui-status--none ui-status--sm\" role=\"img\" aria-label=\"Ще не перевіряли\" title=\"Ще не перевіряли\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Сіра крапка<\/span><span class=\"ui-help__pt-text\">Відділ є в плані, але аудитів цього замовлення там не було.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-title-md ui-muted\">—<\/span><\/span><span><span class=\"ui-help__pt-title\">Вимкнена вкладка<\/span><span class=\"ui-help__pt-text\">Відділу немає в плані замовлення.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9.5 6.5H20M9.5 12H20M9.5 17.5H20\"/><path d=\"M4.5 6.5h.5M4.5 12h.5M4.5 17.5h.5\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Топ браку<\/span><span class=\"ui-help__pt-text\">Змінюється разом із вкладкою. На «Усі» однакові види з різних відділів зведені в один рядок, під назвою дрібно — відділи. Клік по виду — графік появи виду й записи лише з ним.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20h16\"/><path d=\"M7 16v-5\"/><path d=\"M12 16V6\"/><path d=\"M17 16V8\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Два графіки<\/span><span class=\"ui-help__pt-text\">Верхній — брак (шт) по днях за період сторінки; сіра риска — того дня не перевіряли. Нижній — брак (%) за весь час: стовпчик на кожен день з аудитом, лінія — критичний рівень.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"8.5\" y=\"5\" width=\"7\" height=\"14\" rx=\"3.5\"/><path d=\"M12 8.5v2\"/><path d=\"M5 9 2 12l3 3\"/><path d=\"m19 9 3 3-3 3\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Прокрутка<\/span><span class=\"ui-help__pt-text\">Графік за весь час відкривається на найсвіжіших днях. Клікніть графік — і колесо миші гортатиме його до старіших днів; клік поза графіком повертає прокрутку сторінки.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 4.5H7a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6.5a2 2 0 0 0-2-2h-2\"/><rect x=\"9\" y=\"3\" width=\"6\" height=\"3.5\" rx=\"1\"/><path d=\"m9 13.5 2 2 4-4\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Записи аудитів<\/span><span class=\"ui-help__pt-text\">Клік по запису розгортає: хто й коли перевіряв, брак з кодами працівників, фото, посилання на пост у Slack.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><div class=\"ui-stack ui-stack--sm\"><span class=\"ui-status-label\"><span class=\"ui-status ui-status--over\" role=\"img\" aria-label=\"Понад критичний рівень\" title=\"Понад критичний рівень\"><\/span><span><b>Шиття<\/b> у №2481: 21 шт браку з 286 перевірених = 7,3%. Це понад критичні 5%.<\/span><\/span><p class=\"ui-text-sm\">Відкрийте вкладку «Шиття» — топ покаже, що 11 із 21 — «Кривий шов». Клік по ньому залишить у записах лише ці аудити; розгорніть запис, щоб побачити код працівника й фото.<\/p><\/div><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Щось незрозуміло або є ідея? Відгук піде з позначкою [Сторінка старшого › Термінал №2481 › Усі відділи]<\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Сторінка старшого › Термінал №2481 › Усі відділи\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Історія аудитів: фільтри й список": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 4.5H7a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6.5a2 2 0 0 0-2-2h-2\"/><rect x=\"9\" y=\"3\" width=\"6\" height=\"3.5\" rx=\"1\"/><path d=\"m9 13.5 2 2 4-4\"/><\/svg><\/span><h4 class=\"ui-help__title\">Історія аудитів: фільтри й список<\/h4><\/header>\n  <p class=\"ui-help__text\">Усі аудити локації за період сторінки — з фільтрами, щоб швидко знайти потрібний і розгорнути його до деталей.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 20.5V10l5.5 3.5V10l5.5 3.5V4h6.5v16.5z\"/><path d=\"M7 17h1.5M11.5 17H13M16.5 17H18\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Відділи<\/span><span class=\"ui-help__pt-text\">Можна вибрати кілька. «Усі» — без обмеження; клік по відділу знімає «Усі». Число на чипі — аудитів відділу за період.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5h16l-6 7.2V18l-4 2v-7.8z\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Виріб, вид браку, працівник, аудитор<\/span><span class=\"ui-help__pt-text\">Поля з пошуком: клікніть і почніть вводити частину назви, коду чи імені — список під полем звужується на кожен символ. Enter бере перший збіг, ✕ скидає вибір. Працівника шукають за кодом (W3, W5…) або за імʼям.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"/><path d=\"m20 20-4.2-4.2\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Пошук<\/span><span class=\"ui-help__pt-text\">Частина назви виробу або номера замовлення: «худі» або «2481».<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10.3 4.1 2.6 17.4a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.1a2 2 0 0 0-3.4 0z\"/><path d=\"M12 9.5v4\"/><path d=\"M12 16.9v.2\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">«З браком», «Без браку» і «Понад норму»<\/span><span class=\"ui-help__pt-text\">«З браком» — лише аудити, де знайшли хоч одну браковану штуку. «Без браку» — навпаки, лише чисті аудити; вмикається замість двох інших. «Понад норму» — лише аудити, де брак строго більший за критичний рівень (5%).<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15.5\" rx=\"2.5\"/><path d=\"M3.5 10h17M8 3v4M16 3v4\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Роздільник дня<\/span><span class=\"ui-help__pt-text\">Аудити згруповано по днях, найновіші вгорі; біля дати — скільки аудитів того дня.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 8.5A2.5 2.5 0 0 1 6.5 6H8l1.5-2h5L16 6h1.5A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z\"/><circle cx=\"12\" cy=\"13\" r=\"3.5\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Значки в рядку<\/span><span class=\"ui-help__pt-text\">Фотоапарат — до браку додано фото. Значок повідомлення — аудитор залишив коментар.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-status ui-status--over ui-status--sm\" role=\"img\" aria-label=\"Понад норму\" title=\"Понад норму\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Червоне коло біля браку<\/span><span class=\"ui-help__pt-text\">Брак цього аудиту понад критичний рівень.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9.5 3.5 7.5 20.5M16.5 3.5l-2 17M4.5 9h16M3.5 15h16\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Розгорнутий аудит<\/span><span class=\"ui-help__pt-text\">Хто й коли перевіряв, скільки штук, брак за видами з кодами працівників, фото (клік — на весь екран) і кнопка «Відкрити в Slack».<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><div class=\"ui-stack ui-stack--sm\"><div class=\"ui-chips\"><span class=\"ui-chip is-selected\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12.5 4.5 4.5L19 7.5\"/><\/svg>ВТК<\/span><span class=\"ui-chip is-selected\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12.5 4.5 4.5L19 7.5\"/><\/svg>Пляма<\/span><span class=\"ui-chip is-selected\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12.5 4.5 4.5L19 7.5\"/><\/svg>З браком<\/span><\/div><p class=\"ui-text-sm\">Треба знайти, де в ВТК пропускали плями: оберіть «ВТК», у «Вид браку» — «Пляма», увімкніть «З браком». Лишаться тільки потрібні аудити; розгорніть рядок — там код працівника, фото й посилання на пост у Slack.<\/p><\/div><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Щось незрозуміло або є ідея? Відгук піде з позначкою [Сторінка старшого › Історія аудитів › Шиття, ВТК]<\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Сторінка старшого › Історія аудитів › Шиття, ВТК\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Аналітика відфільтрованих аудитів": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20h16\"/><path d=\"M7 16v-5\"/><path d=\"M12 16V6\"/><path d=\"M17 16V8\"/><\/svg><\/span><h4 class=\"ui-help__title\">Аналітика відфільтрованих аудитів<\/h4><\/header>\n  <p class=\"ui-help__text\">Зведення по аудитах, які зараз відібрано фільтрами: скільки перевірили, скільки забракували, коли й що саме.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"/><circle cx=\"12\" cy=\"12\" r=\"4.5\"/><path d=\"M12 11.9v.2\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Рахує лише список<\/span><span class=\"ui-help__pt-text\">Кожна зміна фільтра — числа, графік і топ перераховуються під те, що видно в списку (усі сторінки, не лише показані 50).<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3.5\" y=\"4.5\" width=\"17\" height=\"15\" rx=\"2\"/><path d=\"M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Ключові числа<\/span><span class=\"ui-help__pt-text\">Аудитів, перевірено (шт), брак (шт), брак % = брак ÷ перевірено, скільки аудитів понад норму, у скількох днях були аудити.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20h16\"/><path d=\"M7 16v-5\"/><path d=\"M12 16V6\"/><path d=\"M17 16V8\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Брак по днях<\/span><span class=\"ui-help__pt-text\">Стовпчик — брак вибірки за день. Сіра риска — того дня аудитів у вибірці не було. Клік по стовпчику лишає в списку тільки цей день.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9.5 6.5H20M9.5 12H20M9.5 17.5H20\"/><path d=\"M4.5 6.5h.5M4.5 12h.5M4.5 17.5h.5\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Види браку<\/span><span class=\"ui-help__pt-text\">Що бракує найчастіше саме у вибірці. Однакові види з різних відділів злиті, під назвою дрібно — відділи. Клік по виду ставить фільтр «Вид браку».<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Обережно з «З браком»<\/span><span class=\"ui-help__pt-text\">Коли його увімкнено, чисті аудити не рахуються — відсоток браку буде завищений.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><div class=\"ui-kpis\"><div class=\"ui-kpi ui-kpi--sunken\"><span class=\"ui-kpi__label\">Брак<\/span><span class=\"ui-kpi__value ui-num\">27<span class=\"ui-kpi__unit\">шт<\/span><\/span><span class=\"ui-kpi__sub\">у роботі W7<\/span><\/div><div class=\"ui-kpi ui-kpi--sunken\"><span class=\"ui-kpi__label\">Брак, %<\/span><span class=\"ui-kpi__value ui-num\">4,1%<\/span><span class=\"ui-kpi__sub\">27 з 660 шт<\/span><\/div><\/div><p class=\"ui-text-sm\">Обрано «Працівник: W7». Аналітика покаже, скільки браку знайшли в роботі W7 за період, у які дні його було більше і який вид повторюється найчастіше.<\/p><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Щось незрозуміло або є ідея? Відгук піде з позначкою [Сторінка старшого › Історія аудитів › Аналітика вибірки › Шиття, ВТК]<\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Сторінка старшого › Історія аудитів › Аналітика вибірки › Шиття, ВТК\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Працівники: що означають цифри": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0\"/><path d=\"M15.5 4.6a3.5 3.5 0 0 1 0 6.8\"/><path d=\"M18 14.2a6.5 6.5 0 0 1 3.5 5.8\"/><\/svg><\/span><h4 class=\"ui-help__title\">Працівники: що означають цифри<\/h4><\/header>\n  <p class=\"ui-help__text\">Список людей вибраного відділу, чию роботу перевіряли аудитори за вибраний період. Зверху — ті, у кого брак трапляється найчастіше.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 4.5H7a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6.5a2 2 0 0 0-2-2h-2\"/><rect x=\"9\" y=\"3\" width=\"6\" height=\"3.5\" rx=\"1\"/><path d=\"m9 13.5 2 2 4-4\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Аудитів<\/span><span class=\"ui-help__pt-text\">У скількох аудитах перевіряли роботу цієї людини.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3.5\" y=\"3.5\" width=\"17\" height=\"17\" rx=\"3\"/><path d=\"m11 3.5 1.5 5-3 3 3.5 3-1 5.5\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Аудитів із браком<\/span><span class=\"ui-help__pt-text\">У скількох із них знайшли хоча б одну браковану штуку, і яка це частка від усіх аудитів людини.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-badge ui-badge--ok\" role=\"img\" aria-label=\"Добра\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m8 12.3 2.8 2.8 5.4-5.4\"/><\/svg><\/span><\/span><span><span class=\"ui-help__pt-title\">Добра<\/span><span class=\"ui-help__pt-text\">Брак знайшли менше ніж у 15% аудитів.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-badge ui-badge--warn\" role=\"img\" aria-label=\"Середня\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10.3 4.1 2.6 17.4a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.1a2 2 0 0 0-3.4 0z\"/><path d=\"M12 9.5v4\"/><path d=\"M12 16.9v.2\"/><\/svg><\/span><\/span><span><span class=\"ui-help__pt-title\">Середня<\/span><span class=\"ui-help__pt-text\">Від 15% до 35% аудитів із браком.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-badge ui-badge--danger\" role=\"img\" aria-label=\"Слабка\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m9 9 6 6M15 9l-6 6\"/><\/svg><\/span><\/span><span><span class=\"ui-help__pt-title\">Слабка<\/span><span class=\"ui-help__pt-text\">Брак у 35% аудитів і частіше.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-badge\" role=\"img\" aria-label=\"Мало даних\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg><\/span><\/span><span><span class=\"ui-help__pt-title\">Мало даних<\/span><span class=\"ui-help__pt-text\">Менше 5 аудитів — оцінку не ставимо, щоб не робити висновків із випадковості.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"/><path d=\"m13 6 6 6-6 6\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Показати цей аудит<\/span><span class=\"ui-help__pt-text\">У розгорнутому рядку — аудит, де в людини знайшли найбільше браку. Кнопка відкриває його у вкладці «Історія аудитів» з фото й деталями.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><div class=\"ui-stack ui-stack--sm\"><div class=\"ui-row ui-row--sm\"><span class=\"ui-strong\">W7 · Тетяна Б.<\/span><span class=\"ui-badge ui-badge--danger\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m9 9 6 6M15 9l-6 6\"/><\/svg>Слабка<\/span><\/div><p class=\"ui-text-sm ui-soft\">14 аудитів, у 6 з них знайшли брак. 6 ÷ 14 = 43% — більше за 35%, тому оцінка «Слабка».<\/p><\/div><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Щось незрозуміло або є ідея? Відгук піде з позначкою «[Люди › Працівники › Шиття]»<\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Люди › Працівники › Шиття\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Аудитори: хто і як перевіряв": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 4.5H7a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6.5a2 2 0 0 0-2-2h-2\"/><rect x=\"9\" y=\"3\" width=\"6\" height=\"3.5\" rx=\"1\"/><path d=\"m9 13.5 2 2 4-4\"/><\/svg><\/span><h4 class=\"ui-help__title\">Аудитори: хто і як перевіряв<\/h4><\/header>\n  <p class=\"ui-help__text\">Кожен аудитор за вибраний період по всіх відділах локації: скільки перевіряв, чи вистачає вибірки і наскільки суворо шукає брак.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 4.5H7a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6.5a2 2 0 0 0-2-2h-2\"/><rect x=\"9\" y=\"3\" width=\"6\" height=\"3.5\" rx=\"1\"/><path d=\"m9 13.5 2 2 4-4\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Аудитів<\/span><span class=\"ui-help__pt-text\">Скільки аудитів записав у боті за період.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15.5\" rx=\"2.5\"/><path d=\"M3.5 10h17M8 3v4M16 3v4\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">На день<\/span><span class=\"ui-help__pt-text\">Скільки аудитів у середньому припадає на один робочий день.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"/><circle cx=\"12\" cy=\"12\" r=\"4.5\"/><path d=\"M12 11.9v.2\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Вибірка проти норми<\/span><span class=\"ui-help__pt-text\">Чи перевіряє аудитор стільки виробів, скільки треба за нормою. Окреме пояснення — нижче.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 19V5\"/><path d=\"m6 11 6-6 6 6\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Суворість<\/span><span class=\"ui-help__pt-text\">Скільки браку знаходить порівняно з колегами в тих самих умовах. Окреме пояснення — нижче.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m8 12.3 2.8 2.8 5.4-5.4\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Чисті аудити<\/span><span class=\"ui-help__pt-text\">Частка аудитів, у яких не знайшли жодної бракованої штуки.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10.3 4.1 2.6 17.4a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.1a2 2 0 0 0-3.4 0z\"/><path d=\"M12 9.5v4\"/><path d=\"M12 16.9v.2\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Мало браку — ще не чистий процес<\/span><span class=\"ui-help__pt-text\">Дуже багато чистих аудитів разом із суворістю нижче за колег — привід придивитися: можливо, перевірка поверхова.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"/><path d=\"m13 6 6 6-6 6\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Подивитися в історії аудитів<\/span><span class=\"ui-help__pt-text\">У розгорнутому рядку. Відкриває стрічку аудитів цієї людини — лише ті, де знайшли брак.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><p class=\"ui-text-sm ui-soft\"><b>Олег П.<\/b>: 38 аудитів, чистих 84%, суворість 0,6 — нижче за колег, вибірка ×0,6. Багато чистих аудитів + мало браку + замала вибірка: варто вибірково переглянути його аудити в історії.<\/p><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Щось незрозуміло або є ідея? Відгук піде з позначкою «[Люди › Аудитори › Усі відділи]»<\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Люди › Аудитори › Усі відділи\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Суворість аудитора": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5h16l-6 7.2V18l-4 2v-7.8z\"/><\/svg><\/span><h4 class=\"ui-help__title\">Суворість аудитора<\/h4><\/header>\n  <p class=\"ui-help__text\">Показує, скільки браку аудитор знаходить порівняно з колегами, які перевіряли <b>ті самі відділи в ті самі дні<\/b>. Порівнюємо в однакових умовах, тож важкий день чи складний відділ не псують оцінку. Суворість — не «добре» чи «погано»: дивіться її разом із часткою чистих аудитів.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 19V5\"/><path d=\"m6 11 6-6 6 6\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Вище за колег · 1,3<\/span><span class=\"ui-help__pt-text\">Знаходить у 1,3 раза більше браку, ніж колеги в тих самих умовах.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12h17\"/><path d=\"m16 8 4 4-4 4\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">На рівні колег · близько 1,0<\/span><span class=\"ui-help__pt-text\">Знаходить приблизно стільки ж, скільки інші.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14\"/><path d=\"m6 13 6 6 6-6\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Нижче за колег · 0,6<\/span><span class=\"ui-help__pt-text\">Там, де колеги знаходять 10 бракованих штук, цей аудитор знаходить близько 6.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Мало даних<\/span><span class=\"ui-help__pt-text\">Замало спільних із колегами днів і відділів, щоб порівнювати чесно.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><p class=\"ui-text-sm ui-soft\">У ті самі дні в Шитті колеги знаходили в середньому 5 бракованих на кожні 100 перевірених. Наталія Г. — 6,5: 6,5 ÷ 5 = <b>1,3<\/b>, «Вище за колег». Олег П. — 3: 3 ÷ 5 = <b>0,6<\/b>, «Нижче за колег».<\/p><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Щось незрозуміло або є ідея? Відгук піде з позначкою «[Люди › Аудитори › Суворість]»<\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Люди › Аудитори › Суворість\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Вибірка проти норми (×)": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"/><circle cx=\"12\" cy=\"12\" r=\"4.5\"/><path d=\"M12 11.9v.2\"/><\/svg><\/span><h4 class=\"ui-help__title\">Вибірка проти норми (×)<\/h4><\/header>\n  <p class=\"ui-help__text\">Скільки виробів аудитор перевіряє за один аудит порівняно з тим, скільки мав би перевірити за нормою дня відділу. У рядку — «середина» по всіх його аудитах: половина аудитів вище, половина нижче.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-badge ui-badge--ok\" role=\"img\" aria-label=\"Не менше норми\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12.5 4.5 4.5L19 7.5\"/><\/svg><\/span><\/span><span><span class=\"ui-help__pt-title\">×1,0 і більше<\/span><span class=\"ui-help__pt-text\">Перевіряє не менше, ніж потрібно за нормою.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-badge ui-badge--warn\" role=\"img\" aria-label=\"Менше норми\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10.3 4.1 2.6 17.4a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.1a2 2 0 0 0-3.4 0z\"/><path d=\"M12 9.5v4\"/><path d=\"M12 16.9v.2\"/><\/svg><\/span><\/span><span><span class=\"ui-help__pt-title\">Менше ×1,0, наприклад ×0,6<\/span><span class=\"ui-help__pt-text\">Перевіряє 60% від потрібного. Вибірка замала — висновки про брак менш надійні.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-badge\" role=\"img\" aria-label=\"Норма невідома\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg><\/span><\/span><span><span class=\"ui-help__pt-title\">Норма невідома<\/span><span class=\"ui-help__pt-text\">Для відділу немає даних виробництва, тому норму дня не порахувати.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1\"/><circle cx=\"15\" cy=\"6.5\" r=\"2\"/><circle cx=\"9\" cy=\"12\" r=\"2\"/><circle cx=\"17\" cy=\"17.5\" r=\"2\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Звідки береться норма<\/span><span class=\"ui-help__pt-text\">Із налаштувань «Норми» (впевненість норми, множник приросту, мінімум вибірки) та імпорту виробництва — тієї ж норми, що дає жовтий кружок на плитках відділів.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><p class=\"ui-text-sm ui-soft\">Норма Шиття на 12.09 — 60 шт. Того дня було 3 аудити, тож на один аудит припадає 60 ÷ 3 = 20 шт. Олег перевірив 12 шт: 12 ÷ 20 = <b>×0,6<\/b>.<\/p><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Щось незрозуміло або є ідея? Відгук піде з позначкою «[Люди › Аудитори › Вибірка проти норми]»<\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Люди › Аудитори › Вибірка проти норми\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Коригуюча дія: картки «Потребує уваги»": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 12a8 8 0 1 1-2.34-5.66\"/><path d=\"M20 4v4.5h-4.5\"/><path d=\"m8.5 12.5 2.5 2.5 4.5-5\"/><\/svg><\/span><h4 class=\"ui-help__title\">Коригуюча дія: картки «Потребує уваги»<\/h4><\/header>\n  <p class=\"ui-help__text\">Коли в аудиті рівень браку (відбраковані штуки ÷ перевірено) вищий за поріг, бот створює коригуючу дію (КД) і просить відповідального розібратися. Тут — усі дії, які ще не закриті, незалежно від вибраного періоду. Порожньо — це добре.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-badge ui-badge--warn\" role=\"img\" aria-label=\"Не взято\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10.3 4.1 2.6 17.4a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.1a2 2 0 0 0-3.4 0z\"/><path d=\"M12 9.5v4\"/><path d=\"M12 16.9v.2\"/><\/svg><\/span><\/span><span><span class=\"ui-help__pt-title\">Не взято<\/span><span class=\"ui-help__pt-text\">Ніхто ще не взяв дію в боті. Внизу картки — скільки днів вона висить.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-badge ui-badge--info\" role=\"img\" aria-label=\"Взято\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4.5 20.5a7.5 7.5 0 0 1 15 0\"/><\/svg><\/span><\/span><span><span class=\"ui-help__pt-title\">Взято<\/span><span class=\"ui-help__pt-text\">Є відповідальний. Якщо причину вибрано, а що зробили — не описано, картка позначена «Чернетка».<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-badge ui-badge--danger\" role=\"img\" aria-label=\"Рецидив\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m9 9 6 6M15 9l-6 6\"/><\/svg><\/span><\/span><span><span class=\"ui-help__pt-title\">Рецидив<\/span><span class=\"ui-help__pt-text\">Брак повернувся, поки попередня дія була на спостереженні. На картці — блок «Минула коригуюча дія».<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3.5\" y=\"3.5\" width=\"17\" height=\"17\" rx=\"3\"/><path d=\"m11 3.5 1.5 5-3 3 3.5 3-1 5.5\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Числа на картці<\/span><span class=\"ui-help__pt-text\">Вибірка — скільки перевірили. Рівень браку — відбраковані штуки ÷ перевірено. Відбраковано — штуки. «Перевищено в N раза» — рівень браку ÷ поріг.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0\"/><path d=\"M15.5 4.6a3.5 3.5 0 0 1 0 6.8\"/><path d=\"M18 14.2a6.5 6.5 0 0 1 3.5 5.8\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Працівники кодами<\/span><span class=\"ui-help__pt-text\">Червоний код — у людини знайшли брак (скільки штук), зелений — перевірили, браку немає.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" (function () {

  var dashPaused = false;     // черга зупинена (людина зайшла в локацію)
  var dashPending = [];       // локації, які ще не завантажені

  function homeRender() { if (S().page === 'home') P.render(); }

      if (mySeq !== dashSeq) return;                         // застаріле покоління

      dashChunk = shell.chunk || 5;

        if (dashCache[L.id]) H.locs[L.id] = { state: 'ready', data: dashCache[L.id] };
        else H.locs[L.id] = { state: 'queued' };

        (P.SEN.mon.st === 'loading' ? 'Рахуємо норму…' : 'Немає даних виробництва — не порахувати, скільки треба перевірити.') + '</p>');
    } else {
      var scaleMax = Math.max(dep.norm * 1.5, st.checked, 1), left = dep.norm - st.checked;
      var mCls = st.checked >= dep.norm ? 'ui-meter--ok' : (st.n ? 'ui-meter--warn' : '');
      groups.push('<div class="ui-mon__more-row"><span>Норма дня: ' + P.num(st.checked) + ' з ' + P.num(dep.norm) + '</span><b>' + (left > 0 ? 'ще ' + P.num(left) : 'виконано') + '</b></div>' +
        '<span class="ui-meter ' + mCls + '"><span class="ui-meter__fill" style="--w:' + (st.checked / scaleMax * 100).toFixed(1) + '%"></span><span class="ui-meter__mark" style="--at:' + (dep.norm / scaleMax * 100).toFixed(1) + '%"></span></span>');
    }
    groups.push('<div class="ui-mon__more-row"><span>Критичний рівень</span><b>' + P.critTxt() + '</b></div>' +
      (st.n ? '<div class="ui-mon__more-row"><span>Брак зараз</span>' + (st.status === 'over'
        ? '<span class="ui-badge ui-badge--danger">' + P.pct(st.rate) + ' — понад рівень</span>'
        : '<span class="ui-badge ui-badge--ok">' + P.pct(st.rate) + ' — у межах</span>') + '</div>' : ''));
    if (st.n) {
      groups.push('<span class="ui-caption ui-muted">Аудити дня · ' + st.n + '</span><ul class="p02-audits">' +
        st.list.slice().reverse().map(function (a) {
          return '<li><button class="p02-audit pt-rec" type="button" data-act="open-audit" data-v="' + esc(a.id) + '" data-from="general" title="Відкрити в «Історії аудитів»">' +
            '<span class="ui-text-sm ui-strong">' + a.time + ' · ' + esc(a.auditor || 'аудитор не вказаний') + '</span>' +
            '<span class="ui-caption ui-soft">' + esc(a.product) + (a.order ? ' · №' + esc(a.order) : '') + '</span>' +
            '<span class="ui-caption ui-soft">перевірено ' + P.num(a.checked) + ' · брак ' + P.num(a.defQty) + ' шт</span></button></li>';
        }).join('') + '</ul>');
      var types = P.defectTotals(st.list);
      groups.push('<span class="ui-caption ui-muted">Види браку дня · без імен</span>' +
        (types.length ? types.map(function (t) { return '<div class="ui-mon__more-row"><span>' + esc(t.name) + '</span><b>' + P.num(t.qty) + ' шт</b></div>'; }).join('')
          : '<p class="ui-text-sm ui-soft">Браку сьогодні не знайдено.</p>'));
    } else {
      var le = st.lastEver;
      groups.push('<span class="ui-caption ui-muted">Аудити дня</span><p class="ui-text-sm ui-soft">' +
        (le ? 'Сьогодні аудитів не було. Останній — ' + P.dLong(le.date) + (le.time ? ' о ' + le.time : '') + (le.auditor ? ', ' + esc(le.auditor) : '') + '.' : 'Аудитів у відділі ще не було.') + '</p>' +
        (le ? '<button class="ui-btn ui-btn--secondary ui-btn--sm" type="button" data-act="open-audit" data-v="' + esc(le.id) + '" data-from="general">' + ic('audit') + 'Відкрити останній аудит</button>' : ''));
    }
    return '<div class="ui-mon__more">' + groups.map(function (g) { return '<div class="pt-mon-group">' + g + '</div>'; }).join('') + '</div>';
  }

  function allTile() {
    var s = S(), c = 0, d = 0, cnt = { over: 0, short: 0, none: 0, ok: 0, unknown: 0 };
    D.depts.forEach(function (dep) { var st = P.deptToday(dep); c += st.checked; d += st.def; cnt[st.status]++; });
    var sel = !s.dept;
    var line = function (st, n, label) {
      if (!n) return '';
      var icon = st === 'short' ? '<span class="ui-status ui-status--short ui-status--sm" aria-hidden="true">' + n + '</span>'
        : st === 'unknown' ? '<span class="ui-status p02-status-unknown ui-status--sm" aria-hidden="true">' + n + '</span>'
        : P.statusIcon(st, n, true);
      return '<span class="pt-mon-all__stat">' + icon + '<span>' + (st === 'short' || st === 'unknown' ? '' : n + ' ') + label + '</span></span>';
    };
    return '<button class="ui-mon-all pt-mon-all' + (sel ? ' is-selected' : '') + '" type="button" data-act="dept" data-v="" aria-pressed="' + sel + '">' +
      '<span class="ui-mon-all__icon">' + ic('cockpit') + '</span><span class="ui-mon-all__label">Усі</span>' +
      '<span class="pt-mon-all__sums"><span class="ui-mon-all__sub">' + P.num(c) + ' перевірено</span><span class="ui-mon-all__sub">брак ' + P.num(d) + ' шт · ' + P.pct(c ? d / c * 100 : null) + '</span></span>' +
      '<span class="pt-mon-all__stats">' + line('over', cnt.over, 'понад рівень') + line('short', cnt.short, 'недобір') + line('unknown', cnt.unknown, 'норма невідома') +
      line('none', cnt.none, 'без аудитів') + line('ok', cnt.ok, 'виконано') + '</span></button>';
  }

  function monitoring() {
    var s = S(), st = P.senState('main');
    var lay = P.monLayout(Math.min(window.innerWidth || 1440, 1440) - 64, Math.max(1, D.depts.length));
    var gridOpen = '<div class="pt-mon-grid" data-mon-grid style="--mon-cols:' + lay.cols + ';--mon-rows:' + lay.rows + '">';
    var head = '<div class="ui-section-head"><div><h2 class="ui-title-md">Відділи сьогодні</h2><p class="ui-caption ui-muted">' +
      P.wd(D.TODAY) + ', ' + P.dLong(D.TODAY) + ' · станом на ' + esc(s.stamp.time) + ' · період на плитки не діє</p></div>' + P.helpBtn('mon') + '</div>' +
      P.helpPanel('mon', ['Значок стану біля назви відділу', 'Плитки відділів: вибір і деталі']);
    var body;
    if (st === 'loading') {
      body = '<div class="pt-mon-grid" data-mon-grid style="--mon-cols:4;--mon-rows:1"><div class="ui-mon-all pt-mon-all" aria-hidden="true"><span class="ui-spinner" role="status" aria-label="Завантаження відділів"></span><span class="ui-mon-all__sub">Завантаження…</span></div>' +
        [0, 1, 2].map(function () { return '<div class="ui-mon"><div class="ui-mon__main"><span class="ui-stack ui-stack--sm"><span class="ui-skel ui-skel--title"></span><span class="ui-skel ui-skel--text ui-skel--short"></span><span class="ui-skel ui-skel--text"></span><span class="ui-skel ui-skel--text"></span></span></div></div>'; }).join('') + '</div>';
    } else if (st === 'error') {
      body = '<div class="ui-card"><div class="ui-state ui-state--error ui-state--compact"><span class="ui-state__icon">' + ic('error') + '</span><div><p class="ui-state__title">Не вдалося завантажити відділи</p><p class="ui-state__text">' + esc(P.senError('main') || 'Сервер не відповів.') + ' Графік і топ нижче теж чекають.</p></div><button class="ui-btn ui-btn--secondary ui-btn--sm" type="button" data-act="sen-retry">' + ic('refresh') + 'Спробувати ще раз</button></div></div>';
    } else if (!D.depts.length) {
      body = '<div class="ui-card">' + P.emptyState('location', 'У локації немає активних відділів', 'Увімкніть або додайте відділи в Налаштуваннях › Локації й відділи — плитки зʼявляться тут.',
        s.auth.role ? '<button class="ui-btn ui-btn--secondary" type="button" data-act="settings" data-v="locations">' + ic('settings') + 'Відкрити налаштування</button>' : '') + '</div>';
    } else {
      body = gridOpen + allTile() + D.depts.map(tile).join('') + '</div>';
    }
    return '<section class="ui-stack ui-stack--sm" aria-label="Відділи сьогодні">' + head + body + '</section>';
  }

  function chartCard() {
    var s = S(), st = P.senState('main');
    var title = s.unit === 'pct' ? 'Брак за днями, %' : 'Брак за днями, шт';
    var unitSeg = '<div class="ui-seg" role="group" aria-label="Одиниці графіка">' +
      '<button class="ui-seg__btn' + (s.unit === 'pcs' ? ' is-selected' : '') + '" type="button" data-act="unit" data-v="pcs" aria-pressed="' + (s.unit === 'pcs') + '">Штуки</button>' +
      '<button class="ui-seg__btn' + (s.unit === 'pct' ? ' is-selected' : '') + '" type="button" data-act="unit" data-v="pct" aria-pressed="' + (s.unit === 'pct') + '">%</button></div>';
    if (st === 'loading') {
      return '<article class="ui-card" id="pt-card-chart"><div class="ui-card__body ui-stack"><figure class="ch"><figcaption class="ch__head"><div class="ui-stack ui-stack--sm"><span class="ui-skel ui-skel--title"></span><span class="ui-skel ui-skel--text ui-skel--short"></span></div></figcaption>' +
        '<div class="ch-empty"><div class="ui-stack ui-stack--sm"><span class="ui-spinner" role="status" aria-label="Завантаження графіка"></span><span>Рахуємо брак за період…</span></div></div></figure></div></article>';
    }
    if (st === 'error') {
      return '<article class="ui-card" id="pt-card-chart"><div class="ui-card__body"><figure class="ch"><figcaption class="ch__head"><div><div class="ch__title">' + title + '</div><div class="ch__sub">' + esc(P.scopeName()) + ' · ' + P.periodText() + '</div></div></figcaption>' +
        P.errorState('Графік не завантажився', P.senError('main'), 'sen-retry') + '</figure></div></article>';
    }
    var list = P.periodAudits(s.dept);
    var keys = P.dayKeys(s.from, s.to);
    var stats = P.byDay(list);
    var overlay = !!s.defect;
    var cols = P.dayCols(keys, stats, s.unit, function (k, x) {
      var nrm = s.dept ? P.normOn(s.dept, k) : null;
      var extra = nrm != null ? '<div class="ch-tip__row"><span>Норма дня</span><b>' + P.num(nrm) + ' шт</b></div>' : '';
      if (overlay) extra += '<div class="ch-tip__row pt-tip-brand"><span>«' + esc(s.defect) + '»</span><b>' + defectOnDay(x, s.defect) + ' шт</b></div>';
      return extra;
    });
    if (overlay) {
      cols.forEach(function (c) {
        if (c.nodata) return;
        var q = defectOnDay(stats[c.k], s.defect);
        c.v2 = s.unit === 'pct' ? (stats[c.k].checked ? Math.round(q / stats[c.k].checked * 1000) / 10 : 0) : q;
      });
    }
    var empty = !list.length ? '<span>За цей період ' + P.inScope() + ' не було жодного аудиту.</span><span class="ui-caption">Спробуйте ширший період або інший відділ.</span>' : null;
    var legend = overlay
      ? [['', 'Увесь брак дня'], ['selected', '«' + esc(s.defect) + '»'], ['zero', 'Перевіряли, браку 0'], ['nodata', 'Не перевіряли']]
      : [['', 'День з аудитом'], ['selected', 'Вибраний день'], ['zero', 'Перевіряли, браку 0'], ['nodata', 'Не перевіряли']];
    if (s.unit === 'pct') legend.push(['crit', 'Критичний рівень']);
    var chart = P.barChart({
      id: 'gen:' + (s.dept || 'all') + ':' + s.from + ':' + s.to + ':' + s.unit,
      title: title,
      sub: esc(P.scopeName()) + ' · ' + P.periodText() + (s.day ? ' · вибрано ' + P.dLong(s.day) : '') + (overlay ? ' · помаранчевим — «' + esc(s.defect) + '»' : ''),
      actions: unitSeg + P.helpBtn('chart'),
      axisTitle: s.unit === 'pct' ? '% браку = відбраковані штуки ÷ перевірено' : 'Відбраковані штуки за день',
      unit: s.unit, crit: s.unit === 'pct' ? P.crit() : null,
      cols: cols, sel: s.day, act: 'day', legend: legend, emptyHtml: empty, overlay: overlay
    });
    return '<article class="ui-card" id="pt-card-chart"><div class="ui-card__body ui-stack">' + chart + P.helpPanel('chart', ['Графік браку за днями']) + dayDetail(stats) + '</div></article>';
  }
  function defectOnDay(x, name) {
    if (!x) return 0;
    var q = 0;
    x.audits.forEach(function (a) { a.defects.forEach(function (l) { if (l.type === name) q += l.qty; }); });
    return q;
  }

  function dayDetail(stats) {
    var s = S();
    if (!s.day || !stats[s.day]) return '';
    var x = stats[s.day];
    var types = P.defectTotals(x.audits);
    var typeTxt = types.slice(0, 2).map(function (t) { return esc(t.name) + ' ' + t.qty; }).join(' · ');
    var rest = types.slice(2).reduce(function (a, t) { return a + t.qty; }, 0);
    if (rest) typeTxt += ' · інші ' + rest;
    var rate = x.checked ? x.def / x.checked * 100 : 0;
    var norm = s.dept ? P.normOn(s.dept, s.day) : null;
    var over = P.isOver(x.checked, x.def);
    return '<div class="ui-card ui-card--sunken"><div class="ui-card__body ui-stack">' +
      '<div class="ui-row ui-row--between"><div><h4 class="ui-title-md">' + P.dLong(s.day) + ', ' + P.wd(s.day) + '</h4>' +
      '<p class="ui-caption ui-muted">' + esc(P.scopeName()) + ' · ' + P.pl(x.n, 'аудит', 'аудити', 'аудитів') + ' · топ браку й графік появи нижче теж показують цей день</p></div>' +
      '<div class="ui-row ui-row--sm"><button class="ui-btn ui-btn--secondary ui-btn--sm" type="button" data-act="day-history">' + ic('audit') + 'Аудити дня в історії</button>' +
      '<button class="ui-btn ui-btn--quiet ui-btn--sm" type="button" data-act="day" data-k="' + s.day + '">' + ic('close') + 'Скинути вибір дня</button></div></div>' +
      '<div class="ui-kpis">' +
      '<div class="ui-kpi"><span class="ui-kpi__label">Перевірено</span><span class="ui-kpi__value">' + P.num(x.checked) + '<span class="ui-kpi__unit">шт</span></span><span class="ui-kpi__sub">' + (norm != null ? 'норма дня ' + P.num(norm) : (s.dept ? 'норма невідома' : 'усі відділи разом')) + '</span></div>' +
      '<div class="ui-kpi"><span class="ui-kpi__label">Брак</span><span class="ui-kpi__value">' + P.num(x.def) + '<span class="ui-kpi__unit">шт</span></span><span class="ui-kpi__sub">' + (typeTxt || 'браку не знайшли') + '</span></div>' +
      '<div class="ui-kpi"><span class="ui-kpi__label">Брак, %</span><span class="ui-kpi__value">' + P.dec(rate, 1) + '<span class="ui-kpi__unit">%</span></span><span class="ui-kpi__sub">' +
      (over ? '<span class="ui-badge ui-badge--danger">понад рівень ' + P.critTxt() + '</span>' : '<span class="ui-badge ui-badge--ok">у межах ' + P.critTxt() + '</span>') + '</span></div>' +
      '</div></div></div>';
  }

  function scopeList() {
    var s = S(), list = P.periodAudits(s.dept);
    if (s.day) list = list.filter(function (a) { return a.date === s.day; });
    return list;
  }

  function topCard() {
    var s = S(), st = P.senState('main'), isAll = !s.dept;
    if (st === 'loading') {
      return '<article class="ui-card" id="pt-card-top"><div class="ui-card__body ui-stack"><span class="ui-skel ui-skel--title"></span>' + new Array(8).join('<span class="ui-skel ui-skel--text"></span>') + '</div></article>';
    }
    if (st === 'error') return '<article class="ui-card" id="pt-card-top"><div class="ui-card__body">' + P.errorState('Топ браку не завантажився', P.senError('main'), 'sen-retry') + '</div></article>';
    var items = P.defectTotals(scopeList());
    var total = items.reduce(function (a, t) { return a + t.qty; }, 0);
    var topN = s.topN;
    var showAll = s.topMode === 'all';
    var n = showAll ? items.length : topN;
    if (s.defect && !items.slice(0, n).some(function (t) { return t.name === s.defect; })) { s.defect = null; s.occDay = null; }
    var seg = '<div class="ui-seg" role="group" aria-label="Скільки показати">' +
      [10, 30].map(function (v) {
        var on = !showAll && topN === v;
        return '<button class="ui-seg__btn' + (on ? ' is-selected' : '') + '" type="button" data-act="topn" data-v="' + v + '" aria-pressed="' + on + '">Топ ' + v + '</button>';
      }).join('') +
      '<button class="ui-seg__btn' + (showAll ? ' is-selected' : '') + '" type="button" data-act="top-all" aria-pressed="' + showAll + '">Усі · ' + items.length + '</button></div>';
    var sub = esc(P.scopeName()) + ' · ' + (s.day ? 'за ' + P.dLong(s.day) : P.dLong(s.from) + ' — ' + P.dLong(s.to)) + ' · ' +
      P.pl(items.length, 'вид', 'види', 'видів') + ' · ' + P.num(total) + ' шт' + (isAll ? ' · однакові назви зведено' : '') + ' · клік по рядку — графік появи виду';
    if (!items.length) {
      return '<article class="ui-card" id="pt-card-top"><div class="ui-card__body"><div class="ui-toplist__head"><div><div class="ch__title">Що бракує найчастіше</div><div class="ch__sub">' + sub + '</div></div>' + P.helpBtn('top') + '</div>' +
        P.helpPanel('top', ['Що бракує найчастіше']) +
        P.emptyState('success', 'Браку за період не знайдено', 'За ' + (s.day ? P.dLong(s.day) : 'цей період') + ' ' + P.inScope() + ' не записано жодної бракованої штуки.') + '</div></article>';
    }
    var allChart = '';
    if (showAll) {
      allChart = P.barChart({
        id: 'all:' + (s.dept || 'all') + ':' + s.from + ':' + s.to + ':' + (s.day || ''),
        title: 'Усі види браку · ' + items.length, sub: 'від найчастішого до найрідшого · клік по стовпчику розгортає вид у списку нижче',
        unit: 'pcs', sel: s.defect, act: 'defect-col', labels: true, start: 'start', valAll: true,
        cols: items.map(function (t) {
          return { k: t.name, x: t.name, title: t.name, v: t.qty,
            tip: '<div class="ch-tip__title">' + esc(t.name) + '</div><div class="ch-tip__row"><span>Штук</span><b>' + t.qty + '</b></div><div class="ch-tip__row"><span>Частка</span><b>' + P.pct(t.qty / total * 100) + '</b></div>' +
              (isAll ? '<div class="ch-tip__row"><span>Відділи</span><b>' + esc(t.deptList.map(P.deptName).join(', ')) + '</b></div>' : '') };
        })
      }) + '<hr class="ui-divider">';
    }
    var list = P.topList(items, { n: n, sel: s.defect, act: 'defect', depts: isAll, wide: true, total: total,
      drop: s.defect ? occDrop() : '' });
    var foot = '<div class="ui-toplist__foot"><button class="ui-btn ui-btn--secondary" type="button" data-act="' + (showAll ? 'topn' : 'top-all') + '"' + (showAll ? ' data-v="' + topN + '"' : '') + '>' +
      ic(showAll ? 'collapse' : 'list') + (showAll ? 'Згорнути до топ ' + topN : 'Показати усе · ' + P.pl(items.length, 'вид', 'види', 'видів')) + '</button></div>';
    return '<article class="ui-card" id="pt-card-top"><div class="ui-card__body"><div class="ui-toplist__head"><div><div class="ch__title">Що бракує найчастіше</div><div class="ch__sub">' + sub + '</div></div>' +
      '<div class="ui-row ui-row--sm">' + seg + P.helpBtn('top') + '</div></div>' + P.helpPanel('top', ['Що бракує найчастіше']) + allChart + list + foot + '</div></article>';
  }

  function occDrop() {
    var s = S();
    var list = P.periodAudits(s.dept);
    var keys = P.dayKeys(s.from, s.to);
    var byDay = P.byDay(list);
    var recs = [];
    var days = keys.map(function (k) {
      var x = byDay[k], r = 0, q = 0;
      if (x) x.audits.forEach(function (a) {
        var qa = 0;
        a.defects.forEach(function (l) { if (l.type === s.defect) qa += l.qty; });
        if (qa) { r++; q += qa; recs.push({ a: a, qty: qa }); }
      });
      return { k: k, audited: !!x, recs: r, qty: q };
    });
    var totalQty = recs.reduce(function (a, x) { return a + x.qty; }, 0);
    var close = '<button class="ui-btn ui-btn--quiet ui-btn--icon ui-btn--sm" type="button" data-act="defect" data-v="' + esc(s.defect) + '" aria-label="Згорнути графік появи" title="Згорнути">' + ic('chevron-up') + '</button>';
    var last = recs[recs.length - 1];
    var sub = esc(P.scopeName()) + ' · ' + P.dLong(s.from) + ' — ' + P.dLong(s.to) + ' · ' + P.pl(recs.length, 'запис', 'записи', 'записів') + ' · ' + totalQty + ' шт' +
      (last ? ' · остання поява ' + (last.a.date === D.TODAY ? 'сьогодні' : P.dLong(last.a.date)) + (last.a.time ? ' о ' + last.a.time : '') : '');
    var chart = P.occChart({ id: 'occ:' + (s.dept || 'all') + ':' + s.defect + ':' + s.from + ':' + s.to, days: days, sel: s.occDay, act: 'occ-day' });
    var shown = recs.slice().reverse();
    if (s.occDay) shown = shown.filter(function (x) { return x.a.date === s.occDay; });
    var more = !s.occDay && !s.occAll && shown.length > 6;
    var visible = more ? shown.slice(0, 6) : shown;
