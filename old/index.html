.ui-badge {

.ui-trend {

.ui-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap: var(--sp-3); }
.ui-kpi {
  display: flex; flex-direction: column; gap: 2px; min-width: 0;

}

.ui-meter { position: relative; display: block; height: 8px; border-radius: var(--r-pill); background: var(--surface-3); }

.ui-meter__mark { position: absolute; top: -5px; bottom: -5px; left: var(--at, 0%); width: 2px; margin-left: -1px; border-radius: 2px; background: var(--text-2); }

.ui-avatar {
  display: inline-grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: 50%;
  background: var(--surface-3); color: var(--text-2); font-size: var(--fs-xs); font-weight: var(--fw-bold); line-height: 1;
}


.ui-status {
  --s: 32px;
  position: relative; display: inline-grid; place-items: center; flex: none;
  min-width: var(--s); height: var(--s); border-radius: var(--r-pill);
  font-size: var(--fs-xs); font-weight: var(--fw-bold); line-height: 1; font-variant-numeric: tabular-nums;
}
.ui-status--sm { --s: 24px; }
.ui-status--lg { --s: 40px; }
.ui-status::before, .ui-status::after { grid-area: 1 / 1; }

.ui-status--none::before {
  content: ""; width: calc(var(--s) * .32); height: calc(var(--s) * .32); border-radius: 50%; background: var(--neutral);
}
.ui-status--ok::before {
  content: ""; width: calc(var(--s) * .3); height: calc(var(--s) * .56);
  border: solid var(--ok); border-width: 0 calc(var(--s) * .11) calc(var(--s) * .11) 0; border-radius: 2px;
  transform: translateY(calc(var(--s) * -.07)) rotate(45deg);
}

  padding: 0 7px; background: var(--warn-fill); color: var(--on-warn);

}

.ui-status--over { background: var(--danger-fill); color: var(--on-danger); }
.ui-status--over::before {
  content: ""; width: calc(var(--s) * .11); height: calc(var(--s) * .34); border-radius: 3px; background: currentColor;
  transform: translateY(calc(var(--s) * -.08));
}
.ui-status--over::after {
  content: ""; width: calc(var(--s) * .12); height: calc(var(--s) * .12); border-radius: 50%; background: currentColor;
  transform: translateY(calc(var(--s) * .23));
}

.ui-status-label { display: inline-flex; align-items: center; gap: 10px; font-size: var(--fs-sm); color: var(--text-2); }


.ui-card {
  display: flex; flex-direction: column; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--sh-1);
}

.ui-card__body { padding: var(--sp-4) var(--sp-5); min-width: 0; }
.ui-card__foot { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: var(--sp-3); padding: var(--sp-3) var(--sp-5); border-top: 1px solid var(--line); }


.ui-banner {

.ui-toasts { position: fixed; right: 24px; bottom: 104px; z-index: 120; display: flex; flex-direction: column; gap: 10px; }

.ui-toast--ok     { border-left-color: var(--ok); }
.ui-toast--ok > .ui-icon { color: var(--ok); }
.ui-toast--warn   { border-left-color: var(--warn-line); }

.ui-state { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: var(--sp-7) var(--sp-6); color: var(--text-2); }

.ui-spinner {

.ui-skel { display: block; border-radius: var(--r-sm); background: var(--surface-3); animation: ui-pulse 1.4s ease-in-out infinite; }

.ui-popover {

.ui-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }

.ui-collapse { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }

  display: flex; align-items: center; gap: var(--sp-3); min-height: 56px; padding: 10px 18px;

.ui-header { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; padding: var(--sp-4) 0; }

.ui-user {

.ui-dock-anchor { position: fixed; right: 24px; bottom: 24px; z-index: 60; }
.ui-dock {
  display: inline-flex; align-items: center; gap: 4px; padding: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-pill); box-shadow: var(--sh-3);
}
.ui-dock--vertical { flex-direction: column; align-items: stretch; border-radius: var(--r-xl); }

  position: relative; display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 18px 0 14px;

.ui-modal-backdrop {

}
.ui-modal {

wBox="0 0 24 24"><path d="m3 7 6 6 4-4 8 8"/><path d="M15 17h6v-6"/></symbol><symbol id="i-trend-flat" viewBox="0 0 24 24"><path d="M3 12h17"/><path d="m16 8 4 4-4 4"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></symbol><symbol id="i-scroll" viewBox="0 0 24 24"><rect x="8.5" y="5" width="7" height="14" rx="3.5"/><path d="M12 8.5v2"/><path d="M5 9 2 12l3 3"/><path d="m19 9 3 3-3 3"/></symbol><symbol id="i-checked" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 11.9v.2"/></symbol><symbol id="i-slack" viewBox="0 0 24 24"><path d="M9.5 3.5 7.5 20.5M16.5 3.5l-2 17M4.5 9h16M3.5 15h16"/></symbol><symbol id="i-backup" viewBox="0 0 24 24"><ellipse cx="11" cy="6" rx="7" ry="2.5"/><path d="M4 6v12c0 1.4 3.1 2.5 7 2.5"/><path d="M18 6v4"/><path d="M4 12c0 1.4 3.1 2.5 7 2.5"/><path d="M21 18a3.5 3.5 0 1 1-1.03-2.47"/><path d="M20.5 13v2.5H18"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4"/><path d="m10.5 12.5 9-9"/><path d="m16.5 6.5 3 3"/><path d="m14 9 2 2"/></symbol><symbol id="i-access" viewBox="0 0 24 24"><path d="M12 3 5 5.8v5.4c0 4.4 3 8.3 7 9.8 4-1.5 7-5.4 7-9.8V5.8z"/><path d="m9 12 2.2 2.2 4.3-4.2"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5v-3a4 4 0 0 1 8 0v3"/></symbol></svg>

window.APP_ASSETS = {"help": {"Як увійти": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14 4h3.5A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5H14\"/><path d=\"m10 8 4 4-4 4\"/><path d=\"M14 12H4\"/><\/svg><\/span><h4 class=\"ui-help__title\">Як увійти<\/h4><\/header>\n  <p class=\"ui-help__text\">Головну бачать усі колеги в домені без входу. Вхід потрібен, щоб відкрити налаштування і щоб бачити адміністраторські дії.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"7.5\" cy=\"15.5\" r=\"4\"/><path d=\"m10.5 12.5 9-9\"/><path d=\"m16.5 6.5 3 3\"/><path d=\"m14 9 2 2\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Роль і пароль — основний спосіб<\/span><span class=\"ui-help__pt-text\">Оберіть, хто ви: старший аудитор, керівник чи адміністратор. Введіть пароль ролі, який видав адміністратор.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4.5 20.5a7.5 7.5 0 0 1 15 0\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Персональний логін — запасний спосіб<\/span><span class=\"ui-help__pt-text\">Для тих, кому адміністратор створив власний логін у Налаштуваннях › Користувачі. Перемикач — під кнопкою «Увійти».<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"10.5\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 10.5v-3a4 4 0 0 1 8 0v3\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Роль сіра й не вибирається<\/span><span class=\"ui-help__pt-text\">Для неї ще не задано пароль. Адміністратор задає його в Налаштуваннях › Паролі ролей.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7.5V12l3 2\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Час сесії вийшов<\/span><span class=\"ui-help__pt-text\">Вікно відкривається саме, з жовтим попередженням. Після входу ви лишаєтесь на тому ж екрані.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><p class=\"ui-text-sm\">Олена — старший аудитор у Цеху А. Вона тисне «Увійти», обирає «Старший аудитор», вводить пароль і тисне Enter. Якщо пароль не підійде, під полем з’явиться малиновий рядок із підказкою.<\/p><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Відкриє «Ідеї» з підставленим контекстом: [Вхід › Вікно входу]<\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Вхід › Вікно входу\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Як працює «Оновити»": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 11a8 8 0 0 0-14.3-4.3L4 8.5\"/><path d=\"M4 4v4.5h4.5\"/><path d=\"M4 13a8 8 0 0 0 14.3 4.3l1.7-1.8\"/><path d=\"M20 20v-4.5h-4.5\"/><\/svg><\/span><h4 class=\"ui-help__title\">Як працює «Оновити»<\/h4><\/header>\n  <p class=\"ui-help__text\">Кнопка перечитує з таблиці сьогоднішні цифри всіх плиток, не перезавантажуючи сторінку. Вона завжди у правому верхньому куті — і на головній, і на сторінці старшого.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 11a8 8 0 0 0-14.3-4.3L4 8.5\"/><path d=\"M4 4v4.5h4.5\"/><path d=\"M4 13a8 8 0 0 0 14.3 4.3l1.7-1.8\"/><path d=\"M20 20v-4.5h-4.5\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Натиснули<\/span><span class=\"ui-help__pt-text\">Кнопка сіріє, іконка обертається, поруч напис «оновлюємо…». Натиснути вдруге не можна — так запит не задвоїться.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-badge ui-badge--ok\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12.5 4.5 4.5L19 7.5\"/><\/svg><\/span><\/span><span><span class=\"ui-help__pt-title\">«оновлено о 14:32»<\/span><span class=\"ui-help__pt-text\">Зелена позначка з часом тримається кілька секунд. Потім поруч лишається сірий напис «дані на 14:32».<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-badge ui-badge--danger\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m9 9 6 6M15 9l-6 6\"/><\/svg><\/span><\/span><span><span class=\"ui-help__pt-title\">«не вдалося»<\/span><span class=\"ui-help__pt-text\">Старі цифри лишаються на екрані, а напис показує, на котру годину вони. Спробуйте ще раз за хвилину.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7.5V12l3 2\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Без натискання<\/span><span class=\"ui-help__pt-text\">Коли ви повертаєтесь на головну зі сторінки старшого, цифри «сьогодні» оновлюються самі.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><div class=\"ui-stack ui-stack--sm\"><div class=\"ui-row ui-row--sm\"><span class=\"ui-caption ui-muted\" role=\"status\">оновлюємо…<\/span><button class=\"ui-btn ui-btn--secondary\" type=\"button\" disabled aria-busy=\"true\"><svg class=\"ui-icon p01-spin\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 11a8 8 0 0 0-14.3-4.3L4 8.5\"/><path d=\"M4 4v4.5h4.5\"/><path d=\"M4 13a8 8 0 0 0 14.3 4.3l1.7-1.8\"/><path d=\"M20 20v-4.5h-4.5\"/><\/svg>Оновити<\/button><\/div><div class=\"ui-row ui-row--sm\"><span class=\"ui-badge ui-badge--ok\" role=\"status\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12.5 4.5 4.5L19 7.5\"/><\/svg>оновлено о 14:32<\/span><button class=\"ui-btn ui-btn--secondary\" type=\"button\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 11a8 8 0 0 0-14.3-4.3L4 8.5\"/><path d=\"M4 4v4.5h4.5\"/><path d=\"M4 13a8 8 0 0 0 14.3 4.3l1.7-1.8\"/><path d=\"M20 20v-4.5h-4.5\"/><\/svg>Оновити<\/button><\/div><p class=\"ui-text-sm\">О 14:32 старший тисне «Оновити», за дві секунди бачить «оновлено о 14:32» і новий аудит на плитці Цеху А.<\/p><\/div><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Відкриє «Ідеї» з підставленим контекстом: [Головна › Шапка › Оновити]<\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Головна › Шапка › Оновити\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Смуги-попередження під шапкою": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10.3 4.1 2.6 17.4a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.1a2 2 0 0 0-3.4 0z\"/><path d=\"M12 9.5v4\"/><path d=\"M12 16.9v.2\"/><\/svg><\/span><h4 class=\"ui-help__title\">Смуги-попередження під шапкою<\/h4><\/header>\n  <p class=\"ui-help__text\">З’являються тільки коли щось не так і зникають самі, щойно причина минає. Бачать їх усі.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10.3 4.1 2.6 17.4a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.1a2 2 0 0 0-3.4 0z\"/><path d=\"M12 9.5v4\"/><path d=\"M12 16.9v.2\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">«Бот у Slack не відповідає»<\/span><span class=\"ui-help__pt-text\">Бот давно не виходив на зв’язок, тож нові аудити можуть не доходити до таблиці, а цифри на плитках — відставати. Перевірка — кожні 2 хвилини.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m9 9 6 6M15 9l-6 6\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">«Налаштування відкриті будь-кому»<\/span><span class=\"ui-help__pt-text\">Не задано ні пароля адміністратора, ні жодного користувача. Поки так, змінити налаштування може будь-хто в домені.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 5 5.8v5.4c0 4.4 3 8.3 7 9.8 4-1.5 7-5.4 7-9.8V5.8z\"/><path d=\"m9 12 2.2 2.2 4.3-4.2\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Що робити<\/span><span class=\"ui-help__pt-text\">Про бота — скажіть адміністратору. Про налаштування — адміністратор задає пароль у Налаштуваннях › Паролі ролей.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><p class=\"ui-text-sm\">О 14:20 бот замовк. О 14:32 під шапкою з’являється жовта смуга «Востаннє на зв’язку 12 хв тому». Щойно бот оживе, смуга зникне після найближчої перевірки.<\/p><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Відкриє «Ідеї» з підставленим контекстом: [Головна › Попередження]<\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Головна › Попередження\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Як читати плитку локації": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s-6.5-5.8-6.5-11a6.5 6.5 0 0 1 13 0c0 5.2-6.5 11-6.5 11z\"/><circle cx=\"12\" cy=\"10\" r=\"2.5\"/><\/svg><\/span><h4 class=\"ui-help__title\">Як читати плитку локації<\/h4><\/header>\n  <p class=\"ui-help__text\">Одна плитка — одна локація. Угорі графік за останні 14 днів, під ним — що відбувається сьогодні в кожному відділі.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20h16\"/><path d=\"M7 16v-5\"/><path d=\"M12 16V6\"/><path d=\"M17 16V8\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Графік<\/span><span class=\"ui-help__pt-text\">Один стовпчик — один відділ, у тому самому порядку, що й рядки. Висота — скільки штук відбракували за 14 днів. Наведіть курсор — побачите точну кількість і скільки перевірили.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ch-legend\"><span class=\"ch-key ch-key--zero\"><\/span><\/span><\/span><span><span class=\"ui-help__pt-title\">Тонка сходинка<\/span><span class=\"ui-help__pt-text\">Відділ перевіряли, але браку за 14 днів не знайшли.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ch-legend\"><span class=\"ch-key ch-key--nodata\"><\/span><\/span><\/span><span><span class=\"ui-help__pt-title\">Сіра риска внизу<\/span><span class=\"ui-help__pt-text\">За 14 днів у відділі не було жодного аудиту.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3.5\" y=\"4.5\" width=\"17\" height=\"15\" rx=\"2\"/><path d=\"M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Рядок відділу<\/span><span class=\"ui-help__pt-text\">Три числа за сьогодні: скільки виробів перевірено, скільки з них браковані (штуки) і який це відсоток. Відсоток = брак ÷ перевірено.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-title-md ui-muted\">—<\/span><\/span><span><span class=\"ui-help__pt-title\">Прочерк «—»<\/span><span class=\"ui-help__pt-text\">Сьогодні аудиту ще не було. Це не те саме, що 0%: нуль означає «перевірили й браку не знайшли».<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3.5\" y=\"3.5\" width=\"17\" height=\"17\" rx=\"3\"/><path d=\"m11 3.5 1.5 5-3 3 3.5 3-1 5.5\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Число у правому верхньому куті<\/span><span class=\"ui-help__pt-text\">Брак сьогодні по всій локації — сума відділів: відсоток і штуки.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><div class=\"ui-stack ui-stack--sm\"><div class=\"ui-loc__rows\" role=\"table\" aria-label=\"Приклад: Цех А, Шиття\"><div class=\"ui-loc__row ui-loc__row--head\" role=\"row\"><span>Відділ<\/span><span>Перевірено<\/span><span>Брак, шт<\/span><span>Брак, %<\/span><span><\/span><\/div><div class=\"ui-loc__row\" role=\"row\"><span class=\"ui-loc__dept\"><span class=\"ui-status ui-status--over ui-status--sm\" role=\"img\" aria-label=\"Брак понад критичний рівень\" title=\"Брак понад критичний рівень\"><\/span><span class=\"ui-loc__dept-name\">Шиття<\/span><\/span><span class=\"ui-loc__cell\">86<\/span><span class=\"ui-loc__cell\">7<\/span><span class=\"ui-loc__cell is-over\">8,1%<\/span><span class=\"ui-loc__go\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 5 7 7-7 7\"/><\/svg><\/span><\/div><\/div><p class=\"ui-text-sm\">Цех А, Шиття: перевірено 86 виробів, браковані 7 штук, 7 ÷ 86 = 8,1%. Відсоток малиновий, а біля назви червоне коло: 8,1% більше за критичні 5%.<\/p><\/div><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Відкриє «Ідеї» з підставленим контекстом: [Головна › Плитка локації]<\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Головна › Плитка локації\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Що означають значки біля відділу": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"/><circle cx=\"12\" cy=\"12\" r=\"4.5\"/><path d=\"M12 11.9v.2\"/><\/svg><\/span><h4 class=\"ui-help__title\">Що означають значки біля відділу<\/h4><\/header>\n  <p class=\"ui-help__text\">Значок показує стан відділу сьогодні. Якщо підходять кілька станів, показується найважливіший — у порядку цього списку.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-status ui-status--none\" role=\"img\" aria-label=\"Аудитів сьогодні нема\" title=\"Аудитів сьогодні нема\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Сіра крапка — аудитів нема<\/span><span class=\"ui-help__pt-text\">Сьогодні у відділі не перевірили жодного виробу. У рядку прочерки. Наведіть курсор — побачите, коли був останній аудит.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-status ui-status--over\" role=\"img\" aria-label=\"Брак понад критичний рівень\" title=\"Брак понад критичний рівень\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Червоне коло з «!» — брак понад критичний рівень<\/span><span class=\"ui-help__pt-text\">Відсоток браку сьогодні більший за критичний рівень із Налаштувань › Норми (зараз 5%). Рівно 5% — ще не червоне. Червоне важливіше за недобір: навіть коли перевірили мало, ви побачите саме його.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-status ui-status--short\" role=\"img\" aria-label=\"Перевірено менше норми дня: 18\" title=\"Перевірено менше норми дня\">18<\/span><\/span><span><span class=\"ui-help__pt-title\">Число в жовтому колі — перевірено менше норми дня<\/span><span class=\"ui-help__pt-text\">Число — скільки виробів уже перевірили. Норма дня — щонайменше 60 виробів, для великих відділів більше.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-status ui-status--ok\" role=\"img\" aria-label=\"Вибірку виконано\" title=\"Вибірку виконано\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Зелена галочка — вибірку виконано<\/span><span class=\"ui-help__pt-text\">Перевірили не менше норми дня, і брак не перевищує критичний рівень.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-status p01-status-nonorm\" role=\"img\" aria-label=\"Норма невідома: немає даних виробництва\" title=\"Норма невідома: немає даних виробництва\">?<\/span><\/span><span><span class=\"ui-help__pt-title\">Пунктирне коло з «?» — норма невідома<\/span><span class=\"ui-help__pt-text\">Для відділу немає даних виробництва, тож норму дня не порахувати. Замість жовтого чи зеленого — нейтральний значок. Червоне коло все одно з’явиться, якщо брак понад критичний рівень.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><span class=\"ui-status-label\"><span class=\"ui-status ui-status--short\" role=\"img\" aria-label=\"Перевірено менше норми дня: 18\" title=\"Перевірено менше норми дня\">18<\/span><span><b>Друк, Цех А<\/b> — перевірено 18, браку 0. Норма дня — 60, тому жовте коло з числом 18: треба перевірити ще 42 вироби.<\/span><\/span><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Відкриє «Ідеї» з підставленим контекстом: [Головна › Плитка локації › Статуси]<\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Головна › Плитка локації › Статуси\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Куди веде клік по плитці": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"/><path d=\"m13 6 6 6-6 6\"/><\/svg><\/span><h4 class=\"ui-help__title\">Куди веде клік по плитці<\/h4><\/header>\n  <p class=\"ui-help__text\">Плитка — вхід на сторінку старшого цієї локації. Куди саме потрапите, залежить від того, де клікнули.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 5 7 7-7 7\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Клік по рядку відділу<\/span><span class=\"ui-help__pt-text\">Сторінка старшого, вкладка «Загальна аналітика», у моніторингу вже вибраний цей відділ: графік і топ браку — одразу по ньому.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20h16\"/><path d=\"M7 16v-5\"/><path d=\"M12 16V6\"/><path d=\"M17 16V8\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Клік по стовпчику графіка<\/span><span class=\"ui-help__pt-text\">Те саме, що клік по рядку цього відділу.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s-6.5-5.8-6.5-11a6.5 6.5 0 0 1 13 0c0 5.2-6.5 11-6.5 11z\"/><circle cx=\"12\" cy=\"10\" r=\"2.5\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Клік по назві чи порожньому місцю плитки<\/span><span class=\"ui-help__pt-text\">Та сама сторінка, але вибраний квадрат «Усі» — сума всіх відділів.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 12H5\"/><path d=\"m11 6-6 6 6 6\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Назад<\/span><span class=\"ui-help__pt-text\">Кнопка «Назад» у шапці або «Головна» в доку. Цифри «сьогодні» на плитках при поверненні оновляться.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><div class=\"ui-stack ui-stack--sm\"><div class=\"ui-header__crumbs\">Головна <svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 5 7 7-7 7\"/><\/svg> Цех А <svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 5 7 7-7 7\"/><\/svg> Шиття<\/div><p class=\"ui-text-sm\">Старший клікає рядок «Шиття» на плитці Цеху А — відкривається сторінка старшого, і в моніторингу вибрана плитка Шиття:<\/p><div class=\"ui-mon is-selected\"><button class=\"ui-mon__main\" type=\"button\" aria-pressed=\"true\"><span class=\"ui-mon__head\"><span class=\"ui-status ui-status--over\" role=\"img\" aria-label=\"Брак понад критичний рівень\" title=\"Брак понад критичний рівень\"><\/span><span class=\"ui-grow\"><span class=\"ui-mon__name\">Шиття<\/span><span class=\"ui-mon__when\">Аудит о 13:10<\/span><\/span><\/span><span class=\"ui-mon__nums\"><span class=\"ui-mon__num\"><b>86 з 120<\/b><small>перевірено<\/small><\/span><span class=\"ui-mon__num is-over\"><b>7<span class=\"ui-mon__unit\"> шт<\/span> · 8,1%<\/b><small>брак<\/small><\/span><\/span><\/button><button class=\"ui-btn ui-btn--quiet ui-btn--icon ui-btn--sm ui-mon__toggle\" type=\"button\" aria-expanded=\"false\" aria-label=\"Розгорнути Шиття\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 9 7 7 7-7\"/><\/svg><\/button><\/div><\/div><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Відкриє «Ідеї» з підставленим контекстом: [Головна › Плитка локації › Перехід до відділу]<\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Головна › Плитка локації › Перехід до відділу\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Чому плитка ще порожня": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3a9 9 0 1 0 9 9\"/><\/svg><\/span><h4 class=\"ui-help__title\">Чому плитка ще порожня<\/h4><\/header>\n  <p class=\"ui-help__text\">Головна вантажиться частинами: спершу з’являються назви всіх локацій, далі цифри — по кілька локацій за раз. Так першу плитку видно вже за секунду.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-badge\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7.5V12l3 2\"/><\/svg><\/span><\/span><span><span class=\"ui-help__pt-title\">«У черзі»<\/span><span class=\"ui-help__pt-text\">Назва вже є, дані підтягнуться, щойно завантажаться попередні локації. Нічого робити не треба.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-spinner ui-spinner--sm\" role=\"status\" aria-label=\"Завантаження\"><\/span><\/span><span><span class=\"ui-help__pt-title\">«Завантажується…»<\/span><span class=\"ui-help__pt-text\">Цифри саме зараз читаються з таблиці.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m9 9 6 6M15 9l-6 6\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">«Не вдалося завантажити»<\/span><span class=\"ui-help__pt-text\">Одна локація не відповіла — інші працюють. Натисніть «Спробувати ще раз» на цій плитці.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s-6.5-5.8-6.5-11a6.5 6.5 0 0 1 13 0c0 5.2-6.5 11-6.5 11z\"/><circle cx=\"12\" cy=\"10\" r=\"2.5\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">«Немає активних локацій»<\/span><span class=\"ui-help__pt-text\">Жодна локація не ввімкнена. Адміністратор вмикає їх у Налаштуваннях › Локації й відділи.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><p class=\"ui-text-sm\">Цех А уже показує цифри, Цех Б вантажиться, Цех В чекає в черзі, а Цех Г не відповів. Старший тисне «Спробувати ще раз» на плитці Цеху Г — решту сторінки це не перезавантажує.<\/p><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Відкриє «Ідеї» з підставленим контекстом: [Головна › Стани завантаження]<\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Головна › Стани завантаження\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Панель унизу праворуч": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19z\"/><\/svg><\/span><h4 class=\"ui-help__title\">Панель унизу праворуч<\/h4><\/header>\n  <p class=\"ui-help__text\">Док завжди на місці, на будь-якій сторінці. Помаранчевий пункт — там, де ви зараз.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19z\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Головна<\/span><span class=\"ui-help__pt-text\">Список локацій. Зі сторінки старшого — те саме, що «Назад».<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1\"/><circle cx=\"15\" cy=\"6.5\" r=\"2\"/><circle cx=\"9\" cy=\"12\" r=\"2\"/><circle cx=\"17\" cy=\"17.5\" r=\"2\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Налаштування<\/span><span class=\"ui-help__pt-text\">Гостю спершу відкриється вікно входу. Які розділи видно — залежить від доступів ролі.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"10.5\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 10.5v-3a4 4 0 0 1 8 0v3\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Кабінет із замком<\/span><span class=\"ui-help__pt-text\">Розділ тимчасово закритий. Пункт видно лише адміністратору й керівнику; наведіть курсор — з’явиться підказка. Посилання на кабінет (наприклад, зі Slack) відкривають заглушку з кнопкою «До списку локацій».<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><p class=\"ui-text-sm\">Керівник натискає в Slack «Відкрити кабінет» — бачить заглушку «Кабінет керівника тимчасово закритий» і кнопкою повертається до списку локацій.<\/p><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Відкриє «Ідеї» з підставленим контекстом: [Навігація › Док]<\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Навігація › Док\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Як надіслати відгук чи ідею": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg><\/span><h4 class=\"ui-help__title\">Як надіслати відгук чи ідею<\/h4><\/header>\n  <p class=\"ui-help__text\">Ідею бачить адміністратор. Він змінює статус і відповідає — відповідь видно всім у «Що вже запропонували».<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Кнопка «Надіслати відгук/ідею»<\/span><span class=\"ui-help__pt-text\">Є під кожним поясненням у додатку. Відкриває цю форму й сама підставляє, про що мова: екран, блок і відділ.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6 6 18\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Контекст можна прибрати<\/span><span class=\"ui-help__pt-text\">Натисніть × на ньому, якщо ідея не про цей блок.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9.5 6.5H20M9.5 12H20M9.5 17.5H20\"/><path d=\"M4.5 6.5h.5M4.5 12h.5M4.5 17.5h.5\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Статуси<\/span><span class=\"ui-help__pt-text\">Розглядається → Взято в роботу → Зроблено або Відхилено. Під ідеєю — відповідь адміністратора.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7.5V12l3 2\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Подвійне натискання<\/span><span class=\"ui-help__pt-text\">Той самий текст протягом 5 хвилин не приймається, тож дубль не з’явиться.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><p class=\"ui-text-sm\">Олена читає пояснення значків на головній і тисне «Надіслати відгук/ідею». У формі вже стоїть «Головна › Плитка локації › Статуси» і локація Цех А. Вона дописує одне речення й тисне «Надіслати».<\/p><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Відкриє «Ідеї» з підставленим контекстом: [Ідеї та побажання › Форма]<\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Ідеї та побажання › Форма\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Період і кнопка «Оновити»": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15.5\" rx=\"2.5\"/><path d=\"M3.5 10h17M8 3v4M16 3v4\"/><\/svg><\/span><h4 class=\"ui-help__title\">Період і кнопка «Оновити»<\/h4><\/header>\n  <p class=\"ui-help__text\">Період задає, за які дні рахуються графік браку, топ браку, графік появи виду й замовлення. Плитки відділів угорі завжди показують тільки сьогодні.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15.5\" rx=\"2.5\"/><path d=\"M3.5 10h17M8 3v4M16 3v4\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">З … по …<\/span><span class=\"ui-help__pt-text\">Типово — останні 30 днів. Той самий період діє на вкладках «Люди», «Коригуюча дія» й «Історія аудитів».<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6 6 18\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Скинути<\/span><span class=\"ui-help__pt-text\">Повертає останні 30 днів. Неактивна, коли період уже типовий.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 11a8 8 0 0 0-14.3-4.3L4 8.5\"/><path d=\"M4 4v4.5h4.5\"/><path d=\"M4 13a8 8 0 0 0 14.3 4.3l1.7-1.8\"/><path d=\"M20 20v-4.5h-4.5\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Оновити<\/span><span class=\"ui-help__pt-text\">Підтягує свіжі аудити без перезавантаження сторінки. Поки йде оновлення — іконка крутиться, кнопка неактивна, старі цифри лишаються на місці.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m8 12.3 2.8 2.8 5.4-5.4\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Оновлено о 14:32<\/span><span class=\"ui-help__pt-text\">Час, коли дані востаннє прийшли. Не вдалося — червоний напис, а на екрані лишаються попередні дані.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><p class=\"ui-text-sm\">Сторінку відкрили о 14:05, аудитор надіслав аудит о 14:20. Натискаєте «Оновити» — плитка «Шиття» перераховується, поруч з'являється «Оновлено о 14:32».<\/p><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Щось незрозуміло або є ідея? Контекст підставиться сам: <b>[Сторінка старшого › Період і оновлення]<\/b><\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Сторінка старшого › Шапка › Період і оновлення\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Значок стану біля назви відділу": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.8\"/><path d=\"M12 17v.2\"/><\/svg><\/span><h4 class=\"ui-help__title\">Значок стану біля назви відділу<\/h4><\/header>\n  <p class=\"ui-help__text\">Показує, як минає сьогоднішній день у відділі. Перевіряємо по черзі: чи був аудит → чи брак понад критичний рівень → чи набрали норму дня. Перше «так» визначає значок.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-status ui-status--none\" role=\"img\" aria-label=\"Аудитів сьогодні нема\" title=\"Аудитів сьогодні нема\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Сіра крапка — аудитів сьогодні нема<\/span><span class=\"ui-help__pt-text\">Ніхто ще не перевіряв. Під назвою — коли був останній аудит.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-status ui-status--over\" role=\"img\" aria-label=\"Брак понад критичний рівень\" title=\"Брак понад критичний рівень\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Червоне коло з «!» — брак понад критичний рівень<\/span><span class=\"ui-help__pt-text\">Відбраковані штуки ÷ перевірено більше за критичний рівень (зараз 5%). Строго більше: рівно 5,0% — ще не червоне. Важливіше за нестачу вибірки.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-status ui-status--short\" role=\"img\" aria-label=\"Перевірено менше норми дня: 18\" title=\"Перевірено менше норми дня\">18<\/span><\/span><span><span class=\"ui-help__pt-title\">Число в жовтому колі — недобір до норми дня<\/span><span class=\"ui-help__pt-text\">Число — скільки виробів уже перевірили. Норма дня — 60 або більше, залежно від обсягу виробництва.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-status ui-status--ok\" role=\"img\" aria-label=\"Вибірку виконано\" title=\"Вибірку виконано\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Зелена галочка — вибірку виконано<\/span><span class=\"ui-help__pt-text\">Перевірили не менше норми дня, брак не вищий за критичний рівень.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-status p02-status-unknown\" role=\"img\" aria-label=\"Норма дня невідома, перевірено 42\" title=\"Норма дня невідома — немає даних виробництва\">42<\/span><\/span><span><span class=\"ui-help__pt-title\">Число в пунктирному колі — норма невідома<\/span><span class=\"ui-help__pt-text\">Немає даних виробництва, тож не порахувати, скільки треба перевірити. Червоне коло все одно з'явиться, якщо брак понад рівень.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><div class=\"ui-stack ui-stack--sm\"><span class=\"ui-status-label\"><span class=\"ui-status ui-status--short\" role=\"img\" aria-label=\"Перевірено менше норми дня: 18\" title=\"Перевірено менше норми дня\">18<\/span><span><b>Друк<\/b> — перевірено 18 з 60. Треба ще 42 вироби, щоб висновок про брак був надійним.<\/span><\/span><span class=\"ui-status-label\"><span class=\"ui-status ui-status--over\" role=\"img\" aria-label=\"Брак понад критичний рівень\" title=\"Брак понад критичний рівень\"><\/span><span><b>Шиття<\/b> — перевірено 86 з 90, але брак 7 шт · 8,1% більше за 5%. Коло червоне, хоча норму ще не набрали.<\/span><\/span><\/div><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Щось незрозуміло або є ідея? Контекст підставиться сам: <b>[Сторінка старшого › Загальна аналітика › Статуси відділів › Шиття]<\/b><\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Сторінка старшого › Загальна аналітика › Статуси відділів › Шиття\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Плитки відділів: вибір і деталі": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 20.5V10l5.5 3.5V10l5.5 3.5V4h6.5v16.5z\"/><path d=\"M7 17h1.5M11.5 17H13M16.5 17H18\"/><\/svg><\/span><h4 class=\"ui-help__title\">Плитки відділів: вибір і деталі<\/h4><\/header>\n  <p class=\"ui-help__text\">Стрічка згори вкладки: квадрат «Усі» й по плитці на кожен відділ. Цифри — лише за сьогодні, період на них не діє.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3.5\" y=\"3.5\" width=\"7\" height=\"8\" rx=\"1.5\"/><rect x=\"13.5\" y=\"3.5\" width=\"7\" height=\"5\" rx=\"1.5\"/><rect x=\"13.5\" y=\"11.5\" width=\"7\" height=\"9\" rx=\"1.5\"/><rect x=\"3.5\" y=\"14.5\" width=\"7\" height=\"6\" rx=\"1.5\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">«Усі»<\/span><span class=\"ui-help__pt-text\">Сума всіх відділів: перевірено й брак за сьогодні. Завжди найлівіша.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 20.5V10l5.5 3.5V10l5.5 3.5V4h6.5v16.5z\"/><path d=\"M7 17h1.5M11.5 17H13M16.5 17H18\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Клік по плитці<\/span><span class=\"ui-help__pt-text\">Вибирає відділ: графік браку, топ браку й замовлення показують тільки його. Вибрана плитка — з помаранчевою рамкою.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 9 7 7 7-7\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Шеврон праворуч<\/span><span class=\"ui-help__pt-text\">Розгортає деталі дня, не змінюючи вибору: прогрес до норми, аудити дня, види браку без імен, критичний рівень.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"8.5\" y=\"5\" width=\"7\" height=\"14\" rx=\"3.5\"/><path d=\"M12 8.5v2\"/><path d=\"M5 9 2 12l3 3\"/><path d=\"m19 9 3 3-3 3\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Усі плитки видно одразу<\/span><span class=\"ui-help__pt-text\">Плитки стають у кілька рядів, якщо відділів багато. «Усі» — високий блок зліва з підсумком станів.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><p class=\"ui-text-sm\">На головній клікнули рядок «Шиття» в плитці Цеху А — сторінка старшого відкривається з уже вибраною плиткою «Шиття».<\/p><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Щось незрозуміло або є ідея? Контекст підставиться сам: <b>[Сторінка старшого › Загальна аналітика › Плитки відділів]<\/b><\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Сторінка старшого › Загальна аналітика › Плитки відділів\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Графік браку за днями": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20h16\"/><path d=\"M7 16v-5\"/><path d=\"M12 16V6\"/><path d=\"M17 16V8\"/><\/svg><\/span><h4 class=\"ui-help__title\">Графік браку за днями<\/h4><\/header>\n  <p class=\"ui-help__text\">Кожен стовпчик — один день обраного періоду для плитки, вибраної вгорі (відділ або «Усі»). Висота — скільки штук відбракували того дня. Перемикач «Штуки / %» показує замість штук частку від перевірених.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ch-key\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Стовпчик<\/span><span class=\"ui-help__pt-text\">% браку за день = відбраковані штуки ÷ перевірено. Ширина завжди однакова, щоб дні легко було порівнювати й натискати.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ch-key ch-key--crit\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Малинова лінія<\/span><span class=\"ui-help__pt-text\">Видно в режимі «%»: критичний рівень із налаштувань (зараз 5%). Стовпчик вище лінії — день із перевищенням.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ch-key ch-key--nodata\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Сіра риска під віссю<\/span><span class=\"ui-help__pt-text\">Того дня аудиту не було. Це не «нуль браку», а «не знаємо».<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ch-key ch-key--zero\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Тонка сходинка<\/span><span class=\"ui-help__pt-text\">Перевіряли, браку 0.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ch-key ch-key--selected\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Клік по стовпчику<\/span><span class=\"ui-help__pt-text\">Вибирає день: стовпчик стає помаранчевим, решта тьмяніє, під графіком — перевірено, брак у штуках і відсотках. Повторний клік або «Скинути вибір дня» — назад.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"8.5\" y=\"5\" width=\"7\" height=\"14\" rx=\"3.5\"/><path d=\"M12 8.5v2\"/><path d=\"M5 9 2 12l3 3\"/><path d=\"m19 9 3 3-3 3\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Клік по графіку, далі колесо миші<\/span><span class=\"ui-help__pt-text\">Коли днів більше, ніж вміщається: клікніть графік — колесо гортає дні вбік; клік поза ним — знову гортає сторінку. Графік відкривається на сьогоднішньому дні, раніші — ліворуч.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><p class=\"ui-text-sm\">11 вересня у «Шитті» перевірили 118 виробів і відбракували 9 штук: 9 ÷ 118 = 7,6%. Стовпчик вищий за лінію 5% — день із перевищенням.<\/p><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Щось незрозуміло або є ідея? Контекст підставиться сам: <b>[Сторінка старшого › Загальна аналітика › Графік браку › Шиття]<\/b><\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Сторінка старшого › Загальна аналітика › Графік браку › Шиття\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Що бракує найчастіше": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9.5 6.5H20M9.5 12H20M9.5 17.5H20\"/><path d=\"M4.5 6.5h.5M4.5 12h.5M4.5 17.5h.5\"/><\/svg><\/span><h4 class=\"ui-help__title\">Що бракує найчастіше<\/h4><\/header>\n  <p class=\"ui-help__text\">Які види браку трапляються найчастіше за період із шапки. Рахуємо відбраковані штуки; для «Усі» — сума всіх відділів.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9.5 6.5H20M9.5 12H20M9.5 17.5H20\"/><path d=\"M4.5 6.5h.5M4.5 12h.5M4.5 17.5h.5\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Рядок<\/span><span class=\"ui-help__pt-text\">Місце, назва виду, смужка і кількість штук. Смужка — порівняно з першим у списку.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3v3.5c0 3 2.5 4.5 6 6.5 3.5-2 6-3.5 6-6.5V3\"/><path d=\"M12 13v8\"/><path d=\"m9 18 3 3 3-3\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Однакові назви в «Усі»<\/span><span class=\"ui-help__pt-text\">Якщо вид є в кількох відділах, рядок один, а поруч дрібно — ці відділи.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5h16l-6 7.2V18l-4 2v-7.8z\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Топ 10 / Топ 30<\/span><span class=\"ui-help__pt-text\">За замовчуванням — топ 10 найчастіших, перемикач показує до 30. Однаково для відділу й для «Усі відділи».<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14 4h6v6\"/><path d=\"M10 20H4v-6\"/><path d=\"m20 4-6.5 6.5\"/><path d=\"m4 20 6.5-6.5\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Показати усе<\/span><span class=\"ui-help__pt-text\">Усі види з кількістю, часткою і стовпчиковою діаграмою над списком.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 5 7 7-7 7\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Клік по рядку<\/span><span class=\"ui-help__pt-text\">Відкриває графік появи цього виду з реальними записами. Ще один клік — закриває.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><p class=\"ui-text-sm\">«Пляма · Шиття, Пакування, ВТК — 24»: 9 штук у «Шитті», 6 у «Пакуванні» й 9 у «ВТК» за 30 днів.<\/p><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Щось незрозуміло або є ідея? Контекст підставиться сам: <b>[Сторінка старшого › Загальна аналітика › Топ браку › Усі]<\/b><\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Сторінка старшого › Загальна аналітика › Топ браку › Усі\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Графік появи виду браку": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3.5\" y=\"3.5\" width=\"17\" height=\"17\" rx=\"3\"/><path d=\"m11 3.5 1.5 5-3 3 3.5 3-1 5.5\"/><\/svg><\/span><h4 class=\"ui-help__title\">Графік появи виду браку<\/h4><\/header>\n  <p class=\"ui-help__text\">Брак трапляється нерегулярно, тож звичайний стовпчик по днях майже весь порожній. Тут кожен запис видно окремо, а лінія під ним показує, частішає вид чи рідшає.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ch-key ch-key--dot\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Крапка<\/span><span class=\"ui-help__pt-text\">Один запис цього виду в аудиті. Кілька крапок одна над одною — кілька записів того дня.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ch-evt ch-evt--many\">5<\/span><\/span><span><span class=\"ui-help__pt-title\">Кружок із числом<\/span><span class=\"ui-help__pt-text\">Більше 4 записів за день — одна мітка з кількістю.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ch-key ch-key--clean\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Порожнє кільце<\/span><span class=\"ui-help__pt-text\">Того дня перевіряли, але цього виду не знайшли.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ch-key ch-key--nodata\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Сіра риска<\/span><span class=\"ui-help__pt-text\">Аудиту не було — нічого не відомо.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7.5V12l3 2\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Розрив «пауза N днів»<\/span><span class=\"ui-help__pt-text\">Три й більше днів поспіль без аудитів стискаються в один проміжок, щоб не займати місце.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ch-key ch-key--line\"><\/span><\/span><span><span class=\"ui-help__pt-title\">Лінія рівня<\/span><span class=\"ui-help__pt-text\">Середня кількість записів на день з аудитом за останні 7 таких днів. Дні без аудиту її не тягнуть до нуля.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m3 17 6-6 4 4 8-8\"/><path d=\"M15 7h6v6\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Значок тренду<\/span><span class=\"ui-help__pt-text\">Останні 7 днів з аудитом проти попередніх 7: «Росте», «Падає» або «Рівно», якщо зміна менша за 20%.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9.5 3.5 7.5 20.5M16.5 3.5l-2 17M4.5 9h16M3.5 15h16\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Записи під графіком<\/span><span class=\"ui-help__pt-text\">Дата й час, аудитор, виріб, замовлення, штуки, фото й пост аудиту в Slack. Клік по дню лишає записи тільки цього дня.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><p class=\"ui-text-sm\">«Кривий шов» у «Шитті»: за останні 7 днів з аудитом — 11 записів (1,6 на день), за попередні 7 — 6 (0,9). Зміна понад 20% — значок «Росте».<\/p><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Щось незрозуміло або є ідея? Контекст підставиться сам: <b>[Сторінка старшого › Загальна аналітика › Графік появи виду › Кривий шов › Шиття]<\/b><\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Сторінка старшого › Загальна аналітика › Графік появи виду › Кривий шов › Шиття\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z\"/><\/svg>Надіслати відгук/ідею<\/button><\/footer>\n<\/section>", "Таблиця «Аналітика по замовленнях»": "<section class=\"ui-help\">\n  <header class=\"ui-help__head\"><span class=\"ui-help__icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3.5\" y=\"4.5\" width=\"17\" height=\"15\" rx=\"2\"/><path d=\"M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10\"/><\/svg><\/span><h4 class=\"ui-help__title\">Таблиця «Аналітика по замовленнях»<\/h4><\/header>\n  <p class=\"ui-help__text\">Показує, як просувається перевірка кожного замовлення в кожному відділі: скільки вже перевірили й яка це частка від запланованого.<\/p>\n  <ul class=\"ui-help__points\">\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3.5h12v17l-3-2-3 2-3-2-3 2z\"/><path d=\"M9 8h6M9 11.5h6M9 15h3.5\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Рядок — замовлення<\/span><span class=\"ui-help__pt-text\">Номер, виріб, план на кожен відділ і коли був останній аудит. Потрапляють лише замовлення, які хоч раз перевіряли в обраному періоді. Клік по рядку відкриває термінал замовлення.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3.5\" y=\"4.5\" width=\"17\" height=\"15\" rx=\"2\"/><path d=\"M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Комірка «312 · 39%»<\/span><span class=\"ui-help__pt-text\">У відділі перевірили 312 виробів цього замовлення — це 39% від плану відділу (800 шт). Тонка смужка під числом — та сама частка.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><b class=\"ui-text-sm ui-muted\">0 · 0%<\/b><\/span><span><span class=\"ui-help__pt-title\">«0 · 0%»<\/span><span class=\"ui-help__pt-text\">Відділ є в плані замовлення, але там це замовлення ще не перевіряли.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><span class=\"ui-title-md ui-muted\">—<\/span><\/span><span><span class=\"ui-help__pt-title\">Прочерк<\/span><span class=\"ui-help__pt-text\">Відділу немає в плані цього замовлення — перевіряти там нічого.<\/span><\/span><\/li>\n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"/><path d=\"m20 20-4.2-4.2\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Пошук за номером<\/span><span class=\"ui-help__pt-text\">Введіть частину номера: «248» залишить №2481–№2489. Без знака «№».<\/span><\/span><\/li>\n    \n    <li><span class=\"ui-help__pt-icon\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"8.5\" y=\"5\" width=\"7\" height=\"14\" rx=\"3.5\"/><path d=\"M12 8.5v2\"/><path d=\"M5 9 2 12l3 3\"/><path d=\"m19 9 3 3-3 3\"/><\/svg><\/span><span><span class=\"ui-help__pt-title\">Таблиця ширша за екран<\/span><span class=\"ui-help__pt-text\">Прокрутіть убік — стовпець із номером замовлення лишається на місці.<\/span><\/span><\/li>\n  <\/ul>\n  <div class=\"ui-help__example\"><div class=\"ui-help__example-label\"><svg class=\"ui-icon\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5.5\"/><path d=\"M12 7.6v.2\"/><\/svg>Приклад<\/div><div class=\"ui-stack ui-stack--sm\"><div class=\"ui-table-wrap\"><table class=\"ui-table\"><thead><tr><th scope=\"col\">Замовлення<\/th><th scope=\"col\">Пакування<\/th><\/tr><\/thead><tbody><tr><td><div class=\"ui-strong\">№2485<\/div><div class=\"ui-caption ui-muted\">Штани карго · план 650<\/div><\/td><td><div class=\"ui-ostat\"><b>13<\/b><span class=\"ui-ostat__pct\">2%<\/span><span class=\"ui-meter ui-meter--thin\"><span class=\"ui-meter__fill\" style=\"--w:2%\"><\/span><\/span><\/div><\/td><\/tr><\/tbody><\/table><\/div><p class=\"ui-text-sm\">У Пакуванні з 650 запланованих штанів №2485 перевірили лише 13 — це 2%. Решта відділів уже на 20–60%, тож варто попросити аудитора зайти в Пакування.<\/p><\/div><\/div>\n  <footer class=\"ui-help__foot\"><span class=\"ui-help__foot-note\">Щось незрозуміло або є ідея? Відгук піде з позначкою [Сторінка старшого › Аналітика по замовленнях › Усі відділи]<\/span><button class=\"ui-btn ui-btn--feedback\" type=\"button\" data-act=\"feedback\" data-ctx=\"Сторінка старшого › Ана
