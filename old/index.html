      (o.label ? ' aria-label="' + esc(o.label) + '"' : '') + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + '>';
  }

  P.auditEditModal = function (m) {
    var head = '<div class="ui-modal__head"><div><h2 class="ui-modal__title" id="pt-ae-title">Редагувати аудит</h2>' +
      '<p class="ui-caption ui-muted"><span class="ui-num">' + esc(m.auditId) + '</span>' +
      (m.audit ? ' · ' + esc(humanDate(m.audit.date)) + (m.audit.time ? ', ' + esc(m.audit.time) : '') + ' · ' + esc(m.audit.auditor || 'аудитор невідомий') : '') + '</p></div>' +
      '<button class="ui-btn ui-btn--quiet ui-btn--icon" type="button" data-act="modal-close" aria-label="Закрити">' + ic('close') + '</button></div>';

    if (m.loading) {
      return dim(head + '<div class="ui-modal__body"><div class="ui-row ui-row--sm">' +
        '<span class="ui-spinner ui-spinner--sm" role="status" aria-label="Завантаження"></span><span class="ui-text-sm ui-soft">Читаємо аудит…</span></div></div>');
    }
    if (m.loadErr) {
      return dim(head + '<div class="ui-modal__body">' + P.errorState('Не вдалося відкрити аудит', m.loadErr, 'ae-retry') + '</div>');
    }
    if (m.queued) return dim(head + queuedBody(m) + queuedFoot(m));

    var d = deptOf(m);
    var body = '<div class="ui-modal__body" data-keep-scroll="ae"><form class="ui-form ui-stack ui-stack--lg" onsubmit="return false">' +
      notice(m) + locField(m) + deptField(m) + itemsSection(m) + defectsSection(m) + workersSection(m) + commentField(m) +
      (m.serverErr ? '<div class="ui-banner ui-banner--danger" role="alert">' + ic('error') + '<div class="ui-banner__body"><p class="ui-banner__text">' + esc(m.serverErr) + '</p></div></div>' : '') +
      historyBlock(m) + '</form></div>';

    var foot = '<div class="ui-modal__foot"><button class="ui-btn ui-btn--secondary" type="button" data-act="modal-close">Скасувати</button>' +
      '<button class="ui-btn ui-btn--primary" type="button" data-act="ae-save"' + (m.busy ? ' disabled aria-busy="true"' : '') + '>' +
      (m.busy ? '<span class="ui-spinner ui-spinner--sm" aria-hidden="true"></span>Надсилаємо…' : ic('save') + 'Зберегти зміни') + '</button></div>';
    return dim(head + body + foot, d ? '' : '');
  };

  function dim(inner) {
    return '<div class="pt-dim" data-act="modal-bg"><div class="ui-modal pt-modal-lg" role="dialog" aria-modal="true" aria-labelledby="pt-ae-title">' + inner + '</div></div>';
  }

  function notice(m) {
    var pend = m.pending
      ? '<div class="ui-banner ui-banner--warn">' + ic('clock') + '<div class="ui-banner__body"><p class="ui-banner__title">Попередня правка ще застосовується</p>' +
        '<p class="ui-banner__text">' + esc(m.pending.who || 'Хтось') + ' зберіг зміни ' + esc(P.dLong ? P.dLong(String(m.pending.at).slice(0, 10)) : String(m.pending.at).slice(0, 10)) +
        '. Зачекайте, поки бот їх запише, і відкрийте аудит заново.</p></div></div>'
      : '';
    return pend + '<div class="ui-banner">' + ic('info') + '<div class="ui-banner__body">' +
      '<p class="ui-banner__text">Дата, час і аудитор не змінюються — це запис про те, що сталося тоді. ' +
      'Фото лишаються при своєму виді браку: приберете вид — зникне й фото. ' +
      'Зміни запише бот протягом хвилини, і в Slack під постом зʼявиться позначка «відредаговано».</p></div></div>';
  }

  function locName(m, id) { var l = m.locs.filter(function (x) { return x.id === id; })[0]; return l ? l.name : id; }
  function locField(m) {
    if (!m.locs.length || !m.audit) return '';           // старий сервер без списку локацій — поля немає
    var home = m.audit.locationId, t = m.target, below;
    if (!m.moveReady) {
      return '<div class="ui-field"><span class="ui-label">Локація</span><p class="ui-text-sm">' + esc(locName(m, home)) + '</p>' +
        '<p class="ui-hint">Перенести в іншу локацію можна буде, щойно оновлять бота на сервері.</p></div>';
    }
    if (t && t.loading) {
      below = '<div class="ui-row ui-row--sm"><span class="ui-spinner ui-spinner--sm" role="status" aria-label="Завантаження"></span>' +
        '<span class="ui-text-sm ui-soft">Читаємо відділи й людей «' + esc(locName(m, m.loc)) + '»…</span></div>';
    } else if (t && t.err) {
      below = '<p class="ui-error-text">' + ic('error') + esc(t.err) + '</p>';
    } else if (m.loc !== home) {
      var from = esc(locName(m, home));
      below = '<div class="ui-banner ui-banner--warn">' + ic('info') + '<div class="ui-banner__body">' +
        '<p class="ui-banner__title">Аудит переїде в «' + esc(locName(m, m.loc)) + '»</p>' +
        '<p class="ui-banner__text">Разом з усіма виробами, браком, фото й працівниками. Дата, час і аудитор ті самі. ' +
        'У «' + from + '» його більше не буде, а пост у Slack лишиться в старому каналі з позначкою «Перенесено з «' + from + '»». ' +
        'Саме перенесення коригуючої дії не створює' +
        (m.kdRefs.length ? ', а дія ' + esc(m.kdRefs.join(', ')) + ' у «' + from + '» лишиться як є' : '') + '.</p>' +
        clashNote(m, from) + '</div></div>';
    } else {
      below = '<p class="ui-hint">Записали не на ту локацію? Оберіть правильну — аудит переїде туди цілим.</p>';
    }
    return '<div class="ui-field"><label class="ui-label" for="pt-ae-loc">Локація</label>' +
      select({ id: 'pt-ae-loc', field: 'ae-loc', value: m.loc, label: 'Локація',
        options: m.locs.map(function (l) { return { id: l.id, name: l.name + (l.inactive ? ' (вимкнена)' : '') }; }) }) + below + '</div>';
  }

  function clashNote(m, from) {
    if (!m.clash.length) return '';
    return '<p class="ui-banner__text"><b>Увага: ці коди є і в «' + esc(locName(m, m.loc)) + '» — це можуть бути інші люди.</b> ' +
      m.clash.map(function (c) { return esc(c.code) + ': у «' + from + '» — ' + esc(c.home || 'без імені') + ', тут — ' + esc(c.there || 'без імені'); }).join('; ') +
      '. Перевірте «Кого перевіряли» й винних у браку: інакше брак запишеться на іншу людину.</p>';
  }
  function findClash(m) {
    var norm = function (s) { return String(s || '').trim().replace(/\s+/g, ' ').toLowerCase(); };
    var used = m.checked.slice();
    m.defects.forEach(function (d) { if (d.worker && used.indexOf(d.worker) < 0) used.push(d.worker); });
    var homeW = (m.homeCat && m.homeCat.workers) || [];
    var homeName = locName(m, m.audit.locationId);
    return used.map(function (code) {
      var a = homeW.filter(function (w) { return w.code === code; })[0];
      var b = workers(m).filter(function (w) { return w.code === code; })[0];
      if (!a || !b || (a.name && b.name && norm(a.name) === norm(b.name))) return null;
      return { code: code, home: a.name || '', there: b.name || '', homeLoc: homeName };
    }).filter(Boolean);
  }

  function deptField(m) {
    var moving = m.audit && m.loc && m.loc !== m.audit.locationId;
    return '<div class="ui-field"><label class="ui-label" for="pt-ae-dept">Відділ</label>' +
      select({ id: 'pt-ae-dept', field: 'ae-dept', value: m.dept, label: 'Відділ', invalid: !!m.errs.dept,
        empty: m.dept ? '' : '— оберіть відділ —',
        options: ((m.cat && m.cat.depts) || []).map(function (x) { return { id: x.id, name: x.name + (x.active ? '' : ' (вимкнений)') }; }) }) +
      (m.errs.dept ? '<p class="ui-error-text">' + ic('error') + esc(m.errs.dept) + '</p>'
        : '<p class="ui-hint">' + (moving && !m.dept ? 'У новій локації немає такого самого відділу — оберіть, у який відділ перенести аудит.'
          : 'Зміна відділу переносить увесь аудит: вироби й види браку доведеться обрати з довідника нового відділу.') + '</p>') + '</div>';
  }

  function itemsSection(m) {
    var rows = m.items.map(function (it, i) {
      var e = m.errs['i' + i];
      return '<div class="pt-ae-row' + (e ? ' is-invalid' : '') + '">' +
        '<div class="ui-field pt-ae-wide">' + (i === 0 ? '<span class="ui-label">Виріб</span>' : '') +
          select({ field: 'ae-item', i: i, k: 'product', value: it.product, label: 'Виріб', empty: '— оберіть виріб —',
            valueLabel: nameOf(m, 'products', it.product),
            options: listOf(m, 'products') }) + '</div>' +
        '<div class="ui-field">' + (i === 0 ? '<span class="ui-label">Замовлення</span>' : '') +
          '<input class="ui-input" value="' + esc(it.order) + '" data-field="ae-item" data-i="' + i + '" data-k="order" maxlength="60" aria-label="Замовлення" placeholder="без номера"></div>' +
        '<div class="ui-field">' + (i === 0 ? '<span class="ui-label">Перевірено</span>' : '') +
          num({ field: 'ae-item', i: i, k: 'audited', value: it.audited, label: 'Перевірено, шт' }) + '</div>' +
        '<div class="ui-field">' + (i === 0 ? '<span class="ui-label">Відбраковано</span>' : '') +
          num({ field: 'ae-item', i: i, k: 'rejected', value: it.rejected, label: 'Відбраковано, шт', ph: '0' }) + '</div>' +
        '<div class="pt-ae-row__del"><button class="ui-btn ui-btn--quiet ui-btn--icon" type="button" data-act="ae-item-del" data-i="' + i + '" aria-label="Прибрати виріб">' + ic('delete') + '</button></div>' +
        (e ? '<p class="ui-error-text pt-ae-row__err">' + ic('error') + esc(e) + '</p>' : '') + '</div>';
    }).join('');

    return section('Перевірені вироби', 'Скільки штук перевірили й скільки з них не можна віддати замовнику',
      rows + '<div class="ui-row ui-row--sm">' +
        '<button class="ui-btn ui-btn--secondary ui-btn--sm" type="button" data-act="ae-item-add">' + ic('add') + 'Додати виріб</button>' +
        addBtn(m, 'product', 'Новий виріб у довідник') + '</div>' + addForm(m, 'product'));
  }

  function defectsSection(m) {
    var pairs = m.items.map(function (it, i) {
      return { id: it.product + '|' + it.order, name: nameOf(m, 'products', it.product) + (it.order ? ' · №' + it.order : '') || ('виріб ' + (i + 1)) };
    });
    var rows = m.defects.map(function (df, i) {
      var e = m.errs['d' + i];
      return '<div class="pt-ae-row pt-ae-row--def' + (e ? ' is-invalid' : '') + '">' +
        '<div class="ui-field pt-ae-wide">' + (i === 0 ? '<span class="ui-label">Вид браку</span>' : '') +
          select({ field: 'ae-def', i: i, k: 'type', value: df.type, label: 'Вид браку', empty: '— оберіть вид —',
            valueLabel: nameOf(m, 'defects', df.type), options: listOf(m, 'defects') }) + '</div>' +
        '<div class="ui-field pt-ae-wide">' + (i === 0 ? '<span class="ui-label">На виробі</span>' : '') +
          select({ field: 'ae-def', i: i, k: 'pair', value: df.product + '|' + df.order, label: 'На виробі', options: pairs }) + '</div>' +
        '<div class="ui-field pt-ae-wide">' + (i === 0 ? '<span class="ui-label">Хто</span>' : '') +
          select({ field: 'ae-def', i: i, k: 'worker', value: df.worker, label: 'Винний', empty: '— не вказано —',
            options: workers(m).map(function (w) { return { id: w.code, name: workerLabel(m, w.code) + (w.active ? '' : ' (вимкнений)') }; }) }) + '</div>' +
        '<div class="ui-field">' + (i === 0 ? '<span class="ui-label">Штук</span>' : '') +
          num({ field: 'ae-def', i: i, k: 'qty', value: df.qty, label: 'Штук браку' }) + '</div>' +
        '<div class="pt-ae-row__del">' + (df.photo || df.purl ? '<span class="ui-badge ui-badge--outline" title="До цього рядка прикріплене фото">' + ic('photo') + '</span>' : '') +
          '<button class="ui-btn ui-btn--quiet ui-btn--icon" type="button" data-act="ae-def-del" data-i="' + i + '" aria-label="Прибрати брак">' + ic('delete') + '</button></div>' +
        (e ? '<p class="ui-error-text pt-ae-row__err">' + ic('error') + esc(e) + '</p>' : '') + '</div>';
    }).join('');

    return section('Брак', 'Рядок на кожен вид браку й винного. Фото лишається при своєму рядку',
      (rows || '<p class="ui-text-sm ui-soft">Браку в аудиті немає.</p>') +
      '<div class="ui-row ui-row--sm">' +
        '<button class="ui-btn ui-btn--secondary ui-btn--sm" type="button" data-act="ae-def-add">' + ic('add') + 'Додати брак</button>' +
        addBtn(m, 'defect', 'Новий вид браку в довідник') + '</div>' + addForm(m, 'defect'));
  }

  function workersSection(m) {
    var dept = m.dept;
    var list = workers(m).filter(function (w) {
      return w.dept === dept || m.checked.indexOf(w.code) >= 0 || m.defects.some(function (d) { return d.worker === w.code; });
    });
    var chips = list.map(function (w) {
      var on = m.checked.indexOf(w.code) >= 0;
      return '<button class="ui-chip' + (on ? ' is-selected' : '') + '" type="button" data-act="ae-worker" data-v="' + esc(w.code) + '" aria-pressed="' + on + '">' +
        (on ? ic('check') : '') + esc(workerLabel(m, w.code)) + '</button>';
    }).join('') +
    m.checked.filter(function (c) { return !workers(m).some(function (w) { return w.code === c; }); }).map(function (c) {
      return '<button class="ui-chip is-selected" type="button" data-act="ae-worker" data-v="' + esc(c) + '" aria-pressed="true" title="Цього коду немає в довіднику локації">' +
        ic('check') + esc(c) + ' · не з довідника</button>';
    }).join('');
    return section('Кого перевіряли', 'Усі, хто був у вибірці, — і чисті, і винні',
      '<div class="ui-chips">' + (chips || '<span class="ui-text-sm ui-soft">У довіднику цього відділу ще немає працівників.</span>') + '</div>' +
      '<div class="ui-row ui-row--sm">' + addBtn(m, 'worker', 'Новий працівник у довідник') + '</div>' + addForm(m, 'worker'));
  }

  function commentField(m) {
    return '<div class="ui-field"><label class="ui-label" for="pt-ae-comment">Коментар аудитора</label>' +
      '<textarea class="ui-textarea" id="pt-ae-comment" data-field="ae-comment" maxlength="1000" placeholder="Напр.: партія після заміни голки">' + esc(m.comment) + '</textarea></div>';
  }

  function section(title, sub, inner) {
    return '<section class="ui-card"><div class="ui-card__head"><div><h3 class="ui-card__title">' + esc(title) + '</h3>' +
      (sub ? '<p class="ui-card__sub">' + esc(sub) + '</p>' : '') + '</div></div>' +
      '<div class="ui-card__body ui-stack">' + inner + '</div></section>';
  }

  function addBtn(m, kind, label) {
    var on = m.adding && m.adding.kind === kind;
    return '<button class="ui-btn ui-btn--quiet ui-btn--sm' + (on ? ' is-selected' : '') + '" type="button" data-act="ae-add-open" data-v="' + kind + '">' + ic('add') + esc(label) + '</button>';
  }
  function addForm(m, kind) {
    if (!m.adding || m.adding.kind !== kind) return '';
    var a = m.adding;
    var isWorker = kind === 'worker';
    return '<div class="ui-card ui-card--inset"><div class="ui-card__body ui-stack ui-stack--sm">' +
      '<div class="ui-form__row">' +
      (isWorker ? '<div class="ui-field"><label class="ui-label" for="pt-ae-add-code">Код працівника</label>' +
        '<input class="ui-input" id="pt-ae-add-code" data-field="ae-add-code" value="' + esc(a.code || '') + '" maxlength="80" placeholder="напр. W21" data-autofocus></div>' : '') +
      '<div class="ui-field"><label class="ui-label" for="pt-ae-add-name">' + (isWorker ? 'Імʼя (необовʼязково)' : 'Назва') + '</label>' +
      '<input class="ui-input" id="pt-ae-add-name" data-field="ae-add-name" value="' + esc(a.name || '') + '" maxlength="80" placeholder="' +
        (isWorker ? 'напр. Ніна' : kind === 'defect' ? 'напр. Пропущений шов' : 'напр. Лонгслів') + '"' + (isWorker ? '' : ' data-autofocus') + '></div></div>' +
      (a.err ? '<p class="ui-error-text">' + ic('error') + esc(a.err) + '</p>'
        : '<p class="ui-hint">' + (isWorker ? 'Працівник зʼявиться в довіднику локації — його бачитиме й бот у формі аудиту.'
          : 'Позиція зʼявиться в довіднику цього типу відділу. Якщо така назва вже є — візьмемо наявну.') + '</p>') +
      '<div class="ui-row ui-row--sm"><button class="ui-btn ui-btn--primary ui-btn--sm" type="button" data-act="ae-add-do"' + (a.busy ? ' disabled aria-busy="true"' : '') + '>' +
        (a.busy ? '<span class="ui-spinner ui-spinner--sm" aria-hidden="true"></span>Додаємо…' : ic('check') + 'Додати') + '</button>' +
      '<button class="ui-btn ui-btn--quiet ui-btn--sm" type="button" data-act="ae-add-close">Скасувати</button></div></div></div>';
  }

  function historyBlock(m) {
    if (!m.history.length) return '';
    var rows = m.history.map(function (h) {
      var when = String(h.at || '').replace('T', ' ').slice(0, 16);
      var who = h.who || (h.via === 'slack' ? 'аудитор' : '—');
      return '<li class="pt-ae-hist__item"><span class="ui-badge ui-badge--outline">' + (h.via === 'slack' ? ic('slack') + 'Slack' : ic('edit') + 'сайт') + '</span> ' +
        '<span class="ui-num">' + esc(when) + '</span> · ' + esc(who) +
        (h.status && h.status !== 'застосовано' ? ' · <span class="ui-badge ui-badge--warn">' + esc(h.status) + '</span>' : '') +
        (h.summary ? '<span class="ui-caption ui-muted"> — ' + esc(h.summary) + '</span>' : '') + '</li>';
    }).join('');
    return '<details class="pt-ae-hist"><summary class="ui-text-sm">Історія змін цього аудиту · ' + m.history.length + '</summary><ul class="pt-ae-hist__list">' + rows + '</ul></details>';
  }

  function queuedBody(m) {
    var q = m.queued;
    if (q.status === 'застосовано') {
      return '<div class="ui-modal__body"><div class="ui-banner ui-banner--ok">' + ic('success') + '<div class="ui-banner__body">' +
        (q.moveTo
        ? '<p class="ui-banner__title">Готово — аудит перенесено в «' + esc(q.moveTo) + '»</p><p class="ui-banner__text">Бот переніс усі його рядки й оновив пост у Slack. Тут, у старій локації, цього аудиту більше немає.</p></div></div>'
        : '<p class="ui-banner__title">Готово — аудит виправлено</p><p class="ui-banner__text">Бот записав зміни й оновив пост у Slack.</p></div></div>') +
        (q.summary ? '<p class="ui-text-sm ui-soft">' + esc(q.summary) + '</p>' : '') + '</div>';
    }
    if (q.status === 'конфлікт' || q.status === 'помилка') {
      return '<div class="ui-modal__body"><div class="ui-banner ui-banner--danger">' + ic('error') + '<div class="ui-banner__body">' +
        '<p class="ui-banner__title">' + (q.status === 'конфлікт' ? 'Аудит змінили тим часом' : 'Правку не застосовано') + '</p>' +
        '<p class="ui-banner__text">' + esc(q.error || 'Спробуйте ще раз.') + '</p></div></div></div>';
    }
    var late = m.polls >= POLL_MAX;
    return '<div class="ui-modal__body"><div class="ui-banner">' + ic(late ? 'warning' : 'clock') + '<div class="ui-banner__body">' +
      '<p class="ui-banner__title">' + (late ? 'Бот ще не відповів' : q.moveTo ? 'Перенесення прийнято — переносимо' : 'Правку прийнято — записуємо') + '</p>' +
      '<p class="ui-banner__text">' + (late
        ? 'Правка в черзі й не загубиться: бот запише її, щойно відповість. Можна закрити вікно й перевірити аудит пізніше.'
        : 'Зміни записує бот — це триває до хвилини. Вікно закриється саме.') + '</p></div></div>' +
      (m.queued.summary ? '<p class="ui-text-sm ui-soft">' + esc(m.queued.summary) + '</p>' : '') +
      (late ? '' : '<div class="ui-row ui-row--sm"><span class="ui-spinner ui-spinner--sm" role="status" aria-label="Очікування"></span><span class="ui-text-sm ui-soft">Чекаємо на бота…</span></div>') + '</div>';
  }

      ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    a.editedIso = now.toISOString();
    if (q.moveTo) {
      DB.audits[q.loc] = (DB.audits[q.loc] || []).filter(function (x) { return x !== a; });
      var list = DB.audits[q.moveTo] = DB.audits[q.moveTo] || [];
      list.push(a);
      list.sort(function (x, y) { var kx = x.date + ' ' + x.time, ky = y.date + ' ' + y.time; return kx < ky ? -1 : kx > ky ? 1 : 0; });
    }
    q.rec.status = 'застосовано';
    q.rec.appliedAt = now.toISOString();
  }

  M.auditDelete = function (p) {
    if (!role()) return { ok: false, error: 'Потрібен вхід.' };
    if (String(p.password || '') !== 'senior') return { ok: false, error: 'Невірний пароль старшого аудитора.' };
    var a = findAudit(p.locationId, p.auditId);
    if (!a) return { ok: false, error: 'Аудит не знайдено — можливо, його вже видалили. Оновіть сторінку.' };
    var hist = EDITS[p.auditId] = EDITS[p.auditId] || [];
    if (hist.some(function (h) { return h.status === 'нове'; })) {
      return { ok: false, pending: true, error: 'Цей аудит зараз змінюється (правка чи видалення ще в черзі бота). Зачекайте хвилину й оновіть сторінку.' };
    }
    var editId = 'AE-MOCK-' + (Object.keys(QUEUE).length + 1);
    var rec = { editId: editId, auditId: p.auditId, at: new Date().toISOString(), who: role() === 'senior' ? 'oksana' : role(),
      via: 'web', status: 'нове', summary: '🗑 видалення аудиту (1 рядок)' };
    hist.unshift(rec);
    QUEUE[editId] = { rec: rec, polls: 0, audit: a, loc: p.locationId, del: true };
    return { ok: true, editId: editId, rows: 1, kd: [] };
  };

  function deleteInMock(q) {
    DB.audits[q.loc] = (DB.audits[q.loc] || []).filter(function (x) { return x !== q.audit; });
    q.rec.status = 'застосовано';
    q.rec.appliedAt = new Date().toISOString();
  }

  M.auditEditAddItem = function (p) {
    var err = gate(p);
    if (err) return { ok: false, error: err };
    var a = findAudit(p.locationId, (P.S.modal && P.S.modal.auditId) || '');
    var name = String(p.name || '').trim().replace(/\s+/g, ' ');
    if (p.kind === 'worker') {
      var code = String(p.code || '').trim();
      if (!code) return { ok: false, error: 'Вкажіть код працівника.' };
      if (/^W\d+$/i.test(code) && +code.slice(1) <= 40) return { ok: true, id: code.toUpperCase(), existing: true };
      if (a) { a.extraWorkers = a.extraWorkers || []; a.extraWorkers.push({ code: code, dept: p.departmentId, name: name, active: true }); }
      return { ok: true, id: code, existing: false };
    }
    if (!name) return { ok: false, error: 'Порожня назва.' };
    if (p.kind === 'defect') {
      var known = (TYPE_DEFECTS[p.deptTypeId] || []).filter(function (n) { return n.toLowerCase() === name.toLowerCase(); })[0];
      if (known) return { ok: true, id: defectId(known), existing: true };
      var id = defectId(name);
      if (a) { a.extraDefects = a.extraDefects || []; a.extraDefects.push({ id: id, name: name }); }
      return { ok: true, id: id, existing: false };
    }
    if (p.kind === 'product') {
      var hit = PRODUCTS.filter(function (n) { return n.toLowerCase() === name.toLowerCase(); })[0];
      if (hit) return { ok: true, id: hit, existing: true };
      if (a) { a.extraProducts = a.extraProducts || []; a.extraProducts.push({ id: name, name: name }); }
      return { ok: true, id: name, existing: false };
    }
    return { ok: false, error: 'Невідомий тип позиції.' };
  };
})();

(function () {
  'use strict';
  var P = window.P;
  if (P.online()) return;   // страховка: у справжньому Google цей файл нічого не робить

  try { if (!sessionStorage.getItem('mock_role')) sessionStorage.setItem('mock_role', 'senior'); } catch (e) { /* без памʼяті — mock попросить увійти */ }

  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act="settings"]') : null;
    if (!t) return;
    e.preventDefault();
    e.stopPropagation();
    P.toast('info', 'Налаштувань у тестовій версії немає', 'У новому додатку вони будуть інші — зробимо окремо.');
  }, true);
})();

/* ===== main.js ===== */
(function () {
  'use strict';
  var P = window.P;
  P.render();
  P.authBoot().then(function () {
    P.render();
    if (P.SET && P.SET.pendingOpen) { var pend = P.SET.pendingOpen; P.SET.pendingOpen = null; P.openSettings(pend === '1' ? '' : pend); }
    P.bootHome();
    P.watchBot();
    P.watchDay();   // v1.1 (07.10.2026) — новий день, поки вкладка відкрита: «сьогодні» й дані оновлюються самі
    P.loadIdeas();
    var a = P.S.auth;
    if (a.role === 'senior' && a.loc && P.openLocation) setTimeout(function () { if (P.S.page === 'home') P.openLocation(a.loc); }, 300);
  });
  P.onLogin = function (res) {
    if (res && res.role === 'senior' && res.locationId && P.openLocation && P.S.page === 'home') P.openLocation(res.locationId);
    else if (P.S.page === 'senior' && P.reloadSenior) P.reloadSenior();
    else P.reloadHome();
  };
})();
