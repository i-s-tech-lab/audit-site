    /* Тему ставимо ДО малювання сторінки. У працівника типова — темна (рішення власника 07.10). v2.0
       ?embed=1 — форма всередині кабінету старшого: сесія й тема старшого, без шапки й заставки ПК. v2.1
       demoViewRole — як бачить цей додаток адміністратор: тут працівником, у вікні старшого — старшим. v2.2 */
    (function () {
      var embed = /[?&]embed=1/.test(location.search), t = null;
      window.P = embed ? { demoSessionKey: 'demo:me:sr', demoViewRole: 'senior_auditor', embed: true } : { demoViewRole: 'auditor' };
      if (embed) document.documentElement.classList.add('is-embed');
      try { t = JSON.parse(localStorage.getItem(embed ? 'audit-demo:theme:sr' : 'audit-demo:theme')); } catch (e) { /* без памʼяті */ }
      document.documentElement.setAttribute('data-theme', embed ? (t === 'dark' ? 'dark' : 'light') : (t === 'light' ? 'light' : 'dark'));
    })();
  </script>
